<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Flappy Doh">
<meta name="theme-color" content="#8fd3ff">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<title>Flappy Doh</title>
<style>
  :root {
    --ink: #2a1f33;
    --pink: #ff5fa2;
    --pink-dark: #d63a80;
    --panel: #fffaf2;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: #8fd3ff;
    position: fixed; inset: 0;
    overscroll-behavior: none;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
    font-family: ui-rounded, "SF Pro Rounded", "Arial Rounded MT Bold", system-ui, sans-serif;
    color: var(--ink);
  }
  canvas#game { display: block; touch-action: none; }

  #score {
    position: fixed; left: 0; right: 0;
    top: calc(env(safe-area-inset-top) + 28px);
    text-align: center; font-size: 64px; font-weight: 900; color: #fff;
    -webkit-text-stroke: 3px var(--ink); paint-order: stroke fill;
    text-shadow: 0 4px 0 rgba(42,31,51,0.35);
    pointer-events: none;
  }
  #hint {
    position: fixed; left: 0; right: 0; top: 30%;
    text-align: center; font-size: 30px; font-weight: 900; color: #fff;
    -webkit-text-stroke: 2px var(--ink); paint-order: stroke fill;
    pointer-events: none;
    animation: pulse 1s ease-in-out infinite alternate;
  }
  #hint small { display: block; font-size: 16px; -webkit-text-stroke: 1px var(--ink); margin-top: 8px; }
  @keyframes pulse { from { transform: scale(1); } to { transform: scale(1.08); } }

  .overlay {
    position: fixed; inset: 0; z-index: 10;
    display: flex; align-items: center; justify-content: center;
    padding: calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 16px);
    background: rgba(42,31,51,0.25);
    -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px);
  }
  .hidden { display: none !important; }
  .panel {
    width: min(100%, 390px);
    background: var(--panel);
    border: 4px solid var(--ink);
    border-radius: 28px;
    box-shadow: 0 8px 0 var(--ink);
    padding: 20px 18px 18px;
    text-align: center;
    animation: pop .35s cubic-bezier(.3,1.6,.5,1);
  }
  @keyframes pop { from { transform: scale(.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  h1 { margin: 0; font-size: 44px; line-height: 1; font-weight: 900; letter-spacing: -1px; }
  h1 span { color: var(--pink); }
  h2 { margin: 0 0 12px; font-size: 44px; font-weight: 900; color: var(--pink); -webkit-text-stroke: 2px var(--ink); paint-order: stroke fill; }
  .sub { margin: 6px 0 14px; font-weight: 700; opacity: .7; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 16px; }
  .card {
    appearance: none; font: inherit; color: inherit;
    border: 3px solid transparent; border-radius: 18px;
    background: #efe9ff; padding: 6px 4px 8px;
    font-size: 12px; font-weight: 800; line-height: 1.1;
    touch-action: manipulation; cursor: pointer;
  }
  .card canvas { width: 64px; height: 64px; display: block; margin: 0 auto 4px; }
  .card.sel { border-color: var(--pink); background: #ffe3f0; }
  .card.sel canvas { animation: bob .8s ease-in-out infinite alternate; }
  @keyframes bob { from { transform: translateY(2px) scale(1.04, .96); } to { transform: translateY(-4px) scale(.97, 1.04); } }
  .btn {
    appearance: none; font: inherit; width: 100%;
    font-size: 24px; font-weight: 900; color: #fff;
    background: var(--pink); border: 3px solid var(--ink);
    border-radius: 18px; padding: 12px;
    box-shadow: 0 5px 0 var(--ink);
    touch-action: manipulation; cursor: pointer;
  }
  .btn:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--ink); }
  .btn.secondary { background: #7ec8f0; margin-top: 12px; font-size: 20px; }
  .row { display: flex; justify-content: space-between; align-items: center; margin-top: 14px; font-weight: 800; }
  .icon-btn {
    appearance: none; font-size: 22px; background: #efe9ff;
    border: 3px solid var(--ink); border-radius: 14px; width: 48px; height: 44px;
    touch-action: manipulation; cursor: pointer;
  }
  .scores { display: flex; gap: 12px; margin-bottom: 12px; }
  .scores div { flex: 1; background: #efe9ff; border: 3px solid var(--ink); border-radius: 16px; padding: 8px; }
  .scores small { display: block; font-weight: 800; opacity: .7; }
  .scores b { font-size: 40px; }
  .badge {
    display: inline-block; margin-bottom: 14px; padding: 4px 14px;
    background: #ffd84d; border: 3px solid var(--ink); border-radius: 999px; font-weight: 900;
    animation: pulse .6s ease-in-out infinite alternate;
  }
  .hud {
    position: fixed; top: calc(env(safe-area-inset-top) + 14px); left: 14px; z-index: 5;
    background: #fff3b8; border: 3px solid var(--ink); border-radius: 999px;
    padding: 3px 12px; font-weight: 900; font-size: 18px; box-shadow: 0 3px 0 var(--ink);
    pointer-events: none;
  }
  #pauseBtn { position: fixed; top: calc(env(safe-area-inset-top) + 10px); right: 14px; z-index: 5; }
  #count {
    position: fixed; inset: 0; z-index: 20; display: flex; align-items: center; justify-content: center;
    font-size: 150px; font-weight: 900; color: #fff; -webkit-text-stroke: 6px var(--ink); paint-order: stroke fill;
    pointer-events: none;
  }
  .duo { display: flex; gap: 10px; margin-top: 12px; }
  .duo .btn { margin-top: 0; font-size: 16px; padding: 10px 4px; }
  .coin {
    display: inline-block; font-weight: 900; font-size: 18px; background: #fff3b8;
    border: 3px solid var(--ink); border-radius: 999px; padding: 1px 12px;
  }
  .earned {
    display: inline-block; margin: 0 4px 12px; padding: 4px 14px; background: #fff3b8;
    border: 3px solid var(--ink); border-radius: 999px; font-weight: 900;
  }
  #closet .panel { display: flex; flex-direction: column; max-height: 100%; }
  .chead { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .chead h3 {
    margin: 0; font-size: 32px; font-weight: 900; color: var(--pink);
    -webkit-text-stroke: 2px var(--ink); paint-order: stroke fill;
  }
  #preview {
    width: 112px; height: 112px; margin: 0 auto 8px; display: block; flex: none;
    background: #e6f6ff; border: 3px solid var(--ink); border-radius: 24px;
  }
  .tabs { display: flex; gap: 6px; margin-bottom: 8px; flex: none; }
  .tab {
    flex: 1; appearance: none; font: inherit; font-weight: 900; font-size: 14px; padding: 7px 0;
    border: 3px solid var(--ink); border-radius: 14px; background: #efe9ff; color: inherit;
    cursor: pointer; touch-action: manipulation;
  }
  .tab.sel { background: var(--pink); color: #fff; }
  .scroll { overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; touch-action: pan-y; flex: 1 1 auto; min-height: 0; }
  #menu .panel { display: flex; flex-direction: column; max-height: 100%; }
  #dohs { padding: 3px; align-content: start; }
  #items { padding: 3px; margin-bottom: 12px; align-content: start; }
  .card .price { display: block; margin-top: 3px; font-size: 11px; opacity: .85; }
  .card.cant .price { color: #c0264f; }
  .card.shake { animation: shake .3s; }
  @keyframes shake { 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
  .toast {
    position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 24px); transform: translateX(-50%);
    background: var(--ink); color: #fff; padding: 8px 16px; border-radius: 999px; font-weight: 800;
    z-index: 30; pointer-events: none; white-space: nowrap;
  }
  .ci {
    display: inline-block; width: .95em; height: .95em; border-radius: 50%; position: relative;
    vertical-align: -0.12em; margin-right: .22em;
    background: radial-gradient(circle at 35% 30%, #fff7b8 0, #ffd84d 42%, #e9a800 100%);
    border: .13em solid var(--ink);
  }
  .ci::after {
    content: ''; position: absolute; left: 28%; top: 28%; width: 44%; height: 44%;
    border-radius: 50%; border: .09em solid rgba(170,105,0,.65);
  }
  .empty { grid-column: 1 / -1; padding: 14px 8px 6px; font-weight: 800; opacity: .65; }
  .card.owned { opacity: .55; }
  #confirmCv {
    width: 96px; height: 96px; display: block; margin: 6px auto 10px;
    background: #e6f6ff; border: 3px solid var(--ink); border-radius: 22px;
  }
  #confirm .panel h2 { font-size: 34px; margin-bottom: 4px; }
  #confirm .sub { font-size: 18px; opacity: 1; line-height: 1.5; }
  #confirm .sub small { font-size: 14px; opacity: .7; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="score" class="hidden">0</div>
<div id="hint" class="hidden">Tap to squish!<small>Tap anywhere to flap</small></div>

<div id="menu" class="overlay">
  <div class="panel">
    <h1>Flappy<span>Doh</span></h1>
    <p class="sub">Pick your Doh</p>
    <div id="dohs" class="grid scroll"></div>
    <button id="play" class="btn">Play</button>
    <div class="duo"><button id="openCloset" class="btn secondary">👒 My Closet</button><button id="openShop" class="btn secondary">🛍️ Shop</button></div>
    <div class="row"><span id="menuBest">Best: 0</span><span id="menuTokens" class="coin"><span class="ci"></span>0</span><button id="mute" class="icon-btn" aria-label="Sound">🔊</button></div>
  </div>
</div>

<div id="over" class="overlay hidden">
  <div class="panel">
    <h2>SPLAT!</h2>
    <div class="scores">
      <div><small>Score</small><b id="finalScore">0</b></div>
      <div><small>Best</small><b id="finalBest">0</b></div>
    </div>
    <div><span id="earned" class="earned hidden">+0 <span class="ci"></span></span></div>
    <div id="newBest" class="badge hidden">New best!</div>
    <button id="again" class="btn">Play again</button>
    <div class="duo">
      <button id="change" class="btn secondary">Change Doh</button>
      <button id="overCloset" class="btn secondary">👒 Closet</button>
      <button id="overShop" class="btn secondary">🛍️ Shop</button>
    </div>
  </div>
</div>

<div id="hud" class="hud hidden"><span class="ci"></span>0</div>
<button id="pauseBtn" class="icon-btn hidden" aria-label="Pause">⏸</button>
<div id="count" class="hidden">3</div>

<div id="pause" class="overlay hidden">
  <div class="panel">
    <h2>Paused</h2>
    <p class="sub">Your Doh is taking a breather.</p>
    <button id="resume" class="btn">Resume</button>
    <button id="quit" class="btn secondary">Quit to menu</button>
  </div>
</div>

<div id="closet" class="overlay hidden">
  <div class="panel">
    <div class="chead"><h3 id="closetTitle">My Closet</h3><span id="closetTokens" class="coin"><span class="ci"></span>0</span></div>
    <canvas id="preview"></canvas>
    <div class="tabs">
      <button class="tab sel" data-mode="mine">👒 My Closet</button>
      <button class="tab" data-mode="shop">🛍️ Shop</button>
    </div>
    <div class="tabs">
      <button class="tab sel" data-slot="hat">Hats</button>
      <button class="tab" data-slot="face">Faces</button>
      <button class="tab" data-slot="outfit">Outfits</button>
      <button class="tab" data-slot="bling">Bling</button>
    </div>
    <div id="items" class="grid scroll"></div>
    <button id="closetDone" class="btn">Done</button>
  </div>
</div>
<div id="confirm" class="overlay hidden">
  <div class="panel">
    <h2>Buy it?</h2>
    <canvas id="confirmCv"></canvas>
    <p id="confirmText" class="sub"></p>
    <div class="duo"><button id="confirmNo" class="btn secondary">Not yet</button><button id="confirmYes" class="btn">Buy it!</button></div>
  </div>
</div>
<div id="toast" class="toast hidden"></div>

<script>
(() => {
  // ---------- storage (safe) ----------
  const store = {
    get(k, d) { try { const v = localStorage.getItem('flappydoh.' + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem('flappydoh.' + k, JSON.stringify(v)); } catch (e) {} },
  };

  // ---------- characters ----------
  const DOHS = [
    { id: 'cube',     name: 'Nice Cube',       puff: '#bfeaff' },
    { id: 'gumdrop',  name: 'Gumdrop',         puff: '#ff9bd2' },
    { id: 'snowball', name: 'Snowball Crunch', puff: '#ffffff' },
    { id: 'dohnut',   name: 'Dohnut',          puff: '#ffb3d9' },
    { id: 'classic',  name: 'Groovy Glob',     puff: '#b8f27a' },
    { id: 'stardust', name: 'Stardust',        puff: '#d6b8ff' },
    { id: 'retriever', name: 'Golden Retriever', puff: '#f2c46d' },
  ];
  const OUT = '#2a1f33';
  const TAU = Math.PI * 2;

  function rng(seed) { let s = seed >>> 0; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }
  const SPECKS = (() => { const R = rng(7), a = []; for (let i = 0; i < 16; i++) { const ang = R() * TAU, d = Math.sqrt(R()) * 0.82; a.push([Math.cos(ang) * d, Math.sin(ang) * d, 0.035 + R() * 0.05]); } return a; })();
  const SPRINKLES = (() => { const R = rng(11), cols = ['#fff', '#ffd84d', '#6fd3ff', '#8ee04a', '#b06cff']; const a = []; for (let i = 0; i < 14; i++) { const ang = R() * TAU, d = 0.5 + R() * 0.28; a.push([Math.cos(ang) * d, Math.sin(ang) * d, R() * Math.PI, cols[i % cols.length]]); } return a; })();

  function rrPath(c, x, y, w, h, r) {
    c.beginPath(); c.moveTo(x + r, y);
    c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r);
    c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
  }

  function face(c, r, st, oy, k) {
    c.save(); c.translate(0, oy); c.scale(k, k);
    const ey = -r * 0.12, ex = r * 0.36, er = r * 0.14;
    c.fillStyle = OUT; c.strokeStyle = OUT; c.lineCap = 'round';
    if (st.dead) {
      c.lineWidth = r * 0.09;
      for (const s of [-1, 1]) {
        const x = s * ex; c.beginPath();
        c.moveTo(x - er, ey - er); c.lineTo(x + er, ey + er);
        c.moveTo(x + er, ey - er); c.lineTo(x - er, ey + er); c.stroke();
      }
      c.beginPath(); c.ellipse(0, r * 0.3, r * 0.13, r * 0.1, 0, 0, TAU); c.fill();
    } else {
      for (const s of [-1, 1]) { c.beginPath(); c.ellipse(s * ex, ey, er, st.blink ? er * 0.15 : er * 1.25, 0, 0, TAU); c.fill(); }
      if (!st.blink) {
        c.fillStyle = '#fff';
        for (const s of [-1, 1]) { c.beginPath(); c.arc(s * ex + er * 0.35, ey - er * 0.45, er * 0.42, 0, TAU); c.fill(); }
      }
      c.lineWidth = r * 0.07; c.beginPath();
      if (st.flap) c.ellipse(0, r * 0.26, r * 0.1, r * 0.12, 0, 0, TAU), c.fill();
      else c.arc(0, r * 0.12, r * 0.14, 0.15 * Math.PI, 0.85 * Math.PI), c.stroke();
    }
    c.fillStyle = 'rgba(255,100,150,0.45)';
    for (const s of [-1, 1]) { c.beginPath(); c.ellipse(s * r * 0.62, r * 0.18, r * 0.14, r * 0.08, 0, 0, TAU); c.fill(); }
    c.restore();
  }

  function gumdropPath(c, r) {
    c.beginPath();
    c.moveTo(-r * 0.95, r * 0.7);
    c.bezierCurveTo(-r * 1.05, -r * 0.3, -r * 0.55, -r * 1.05, 0, -r * 1.05);
    c.bezierCurveTo(r * 0.55, -r * 1.05, r * 1.05, -r * 0.3, r * 0.95, r * 0.7);
    c.quadraticCurveTo(r * 0.95, r * 0.95, r * 0.7, r * 0.95);
    c.lineTo(-r * 0.7, r * 0.95);
    c.quadraticCurveTo(-r * 0.95, r * 0.95, -r * 0.95, r * 0.7);
    c.closePath();
  }

  // ---------- closet items ----------
  const ITEMS = [
    { id: 'party',  slot: 'hat',    name: 'Party Hat',   price: 10 },
    { id: 'chef',   slot: 'hat',    name: 'Chef Hat',    price: 20 },
    { id: 'cowboy', slot: 'hat',    name: 'Cowboy Hat',  price: 30 },
    { id: 'prop',   slot: 'hat',    name: 'Propeller',   price: 40 },
    { id: 'tophat', slot: 'hat',    name: 'Top Hat',     price: 50 },
    { id: 'crown',  slot: 'hat',    name: 'Crown',       price: 100 },
    { id: 'nerd',   slot: 'face',   name: 'Nerd Specs',  price: 15 },
    { id: 'shades', slot: 'face',   name: 'Shades',      price: 25 },
    { id: 'stache', slot: 'face',   name: 'Mustache',    price: 30 },
    { id: 'hearts', slot: 'face',   name: 'Heart Specs', price: 40 },
    { id: 'bowtie', slot: 'outfit', name: 'Bow Tie',     price: 10 },
    { id: 'tie',    slot: 'outfit', name: 'Necktie',     price: 15 },
    { id: 'scarf',  slot: 'outfit', name: 'Scarf',       price: 25 },
    { id: 'cape',   slot: 'outfit', name: 'Hero Cape',   price: 60 },
    { id: 'tiger',  slot: 'outfit', name: 'Tiger Stripes Tee', price: 45 },
    { id: 'doggy',  slot: 'outfit', name: 'Doggy Costume', price: 70 },
    { id: 'dino',   slot: 'outfit', name: 'Dino Costume', price: 75 },
    { id: 'bunny',  slot: 'outfit', name: 'Plush Bunny', price: 80 },
    { id: 'chain',  slot: 'bling',  name: 'Gold Chain',  price: 90 },
  ];
  // where each Doh's face sits (vertical offset in radii, scale) so glasses line up
  const FACE_XF = { cube: [0.05, 1], retriever: [0.05, 1], gumdrop: [0.12, 0.95], dohnut: [-0.55, 0.62] };

  function heart(c, x, y, s) {
    c.beginPath(); c.moveTo(x, y + s * 0.9);
    c.bezierCurveTo(x - s * 1.5, y - s * 0.1, x - s * 0.7, y - s * 1.1, x, y - s * 0.4);
    c.bezierCurveTo(x + s * 0.7, y - s * 1.1, x + s * 1.5, y - s * 0.1, x, y + s * 0.9);
    c.closePath();
  }

  function bodyClip(c, id, r) {
    if (id === 'cube' || id === 'retriever') rrPath(c, -r, -r, 2 * r, 2 * r, r * 0.42);
    else if (id === 'gumdrop') gumdropPath(c, r);
    else { c.beginPath(); c.arc(0, 0, r, 0, TAU); }
  }
  function withFace(c, id, r, fn) {
    const [oy, k] = FACE_XF[id] || [0, 1];
    c.save(); c.translate(0, oy * r); c.scale(k, k); fn(); c.restore();
  }

  function wearBack(c, r, w, st) {
    const t = st.t || 0, o = w.outfit;
    c.lineWidth = r * 0.07; c.strokeStyle = OUT; c.lineJoin = 'round';
    if (o === 'cape') {
      const wv = Math.sin(t * 8) * r * 0.08;
      c.beginPath();
      c.moveTo(-r * 0.6, -r * 0.2); c.lineTo(r * 0.6, -r * 0.2);
      c.quadraticCurveTo(r * 1.5, r * 0.6, r * 1.3 + wv, r * 1.45);
      c.quadraticCurveTo(0, r * 1.2, -r * 1.3 - wv, r * 1.45);
      c.quadraticCurveTo(-r * 1.5, r * 0.6, -r * 0.6, -r * 0.2);
      c.closePath(); c.fillStyle = '#ff4d6d'; c.fill(); c.stroke();
    } else if (o === 'dino') {
      c.beginPath(); c.moveTo(-r * 0.7, r * 0.25); c.quadraticCurveTo(-r * 1.3, r * 0.3, -r * 1.85, r * 0.95);
      c.quadraticCurveTo(-r * 1.2, r * 1.05, -r * 0.7, r * 0.9); c.closePath();
      c.fillStyle = '#5fc66b'; c.fill(); c.stroke();
      c.fillStyle = '#ff9f3d';
      for (const x of [-0.5, 0, 0.5]) {
        c.beginPath(); c.moveTo((x - 0.2) * r, -r * 0.8); c.lineTo(x * r, -r * 1.3); c.lineTo((x + 0.2) * r, -r * 0.8); c.closePath(); c.fill(); c.stroke();
      }
    } else if (o === 'doggy') {
      c.save(); c.translate(-r * 0.85, r * 0.35); c.rotate(-0.5 + Math.sin(t * 12) * 0.35);
      c.beginPath(); c.ellipse(-r * 0.35, 0, r * 0.45, r * 0.14, 0, 0, TAU);
      c.fillStyle = '#a56f35'; c.fill(); c.stroke(); c.restore();
    } else if (o === 'bunny') {
      for (const s of [-1, 1]) {
        c.save(); c.translate(s * r * 0.42, -r * 0.8); c.rotate(s * 0.3 + Math.sin(t * 3 + s) * 0.04);
        c.beginPath(); c.ellipse(0, -r * 0.55, r * 0.22, r * 0.62, 0, 0, TAU); c.fillStyle = '#fff4f8'; c.fill(); c.stroke();
        c.beginPath(); c.ellipse(0, -r * 0.55, r * 0.1, r * 0.44, 0, 0, TAU); c.fillStyle = '#ffb6cf'; c.fill();
        c.restore();
      }
      c.beginPath(); c.arc(-r * 0.95, r * 0.7, r * 0.22, 0, TAU); c.fillStyle = '#fff'; c.fill(); c.stroke();
    }
  }

  function wearFront(c, id, r, w, st) {
    const t = st.t || 0;

    if (w.face) {

      if (w.face === 'shades') {
        for (const s of [-1, 1]) { rrPath(c, s * ex - r * 0.3, ey - r * 0.2, r * 0.6, r * 0.38, r * 0.14); fill('#2a1f33'); }

        c.strokeStyle = 'rgba(255,255,255,0.75)'; c.lineWidth = r * 0.05;
        for (const s of [-1, 1]) { c.beginPath(); c.moveTo(s * ex - r * 0.2, ey - r * 0.1); c.lineTo(s * ex - r * 0.08, ey - r * 0.02); c.stroke(); }
      } else if (w.face === 'nerd') {
        c.lineWidth = r * 0.08;

        c.bezierCurveTo(-r * 0.4, r * 0.2, -r * 0.2, r * 0.1, 0, r * 0.14);

    if (w.outfit) {

      } else if (o === 'tie') {

      } else if (o === 'scarf') {
        rrPath(c, r * 0.28, r * 0.7, r * 0.3, r * 0.62, r * 0.1); fill('#ff7a4d');
        rrPath(c, -r * 0.8, r * 0.58, r * 1.6, r * 0.3, r * 0.15); fill('#ff7a4d');
        c.strokeStyle = '#fff'; c.lineWidth = r * 0.07;
        for (const x of [-0.55, -0.2, 0.15, 0.5]) { c.beginPath(); c.moveTo(x * r, r * 0.64); c.lineTo(x * r, r * 0.82); c.stroke(); }
      } else if (o === 'cape') {
        c.beginPath(); c.arc(0, r * 0.82, r * 0.11, 0, TAU); fill('#ffd84d');
      } else if (o === 'tiger') {
        // black and gold tiger-stripe tee

        c.beginPath();
        c.moveTo(-1.3 * r, r * 0.3); c.lineTo(-r * 0.32, r * 0.3); c.quadraticCurveTo(0, r * 0.62, r * 0.32, r * 0.3);
        c.lineTo(1.3 * r, r * 0.3); c.lineTo(1.3 * r, 1.3 * r); c.lineTo(-1.3 * r, 1.3 * r); c.closePath();
        c.fillStyle = '#1d1b22'; c.fill();
        c.strokeStyle = '#f2b52b'; c.lineWidth = r * 0.1;
        for (const x of [-0.75, -0.4, 0.4, 0.75]) {
          c.beginPath(); c.moveTo((x - 0.08) * r, r * 0.45); c.lineTo((x + 0.08) * r, r * 0.66);
          c.moveTo((x + 0.06) * r, r * 0.78); c.lineTo((x - 0.06) * r, r * 0.96); c.stroke();
        }
        c.beginPath(); c.moveTo(-r * 0.32, r * 0.3); c.quadraticCurveTo(0, r * 0.62, r * 0.32, r * 0.3);
        c.lineWidth = r * 0.08; c.stroke();
        c.restore();
        bodyClip(c, id, r); c.strokeStyle = OUT; c.lineWidth = r * 0.09; c.stroke();
      } else if (o === 'dino') {
        c.beginPath(); c.ellipse(0, r * 0.7, r * 0.52, r * 0.28, 0, 0, TAU); fill('#e2f7a6');
        for (const s of [-1, 1]) { c.beginPath(); c.ellipse(s * r * 0.97, r * 0.38, r * 0.2, r * 0.13, s * 0.5, 0, TAU); fill('#5fc66b'); }
      } else if (o === 'doggy') {
        for (const s of [-1, 1]) { c.beginPath(); c.ellipse(s * r * 0.84, -r * 0.5, r * 0.22, r * 0.42, s * 0.4, 0, TAU); fill('#8a5a2b'); }
        withFace(c, id, r, () => { c.beginPath(); c.ellipse(0, r * 0.06, r * 0.1, r * 0.07, 0, 0, TAU); c.fillStyle = OUT; c.fill(); });
        rrPath(c, -r * 0.55, r * 0.68, r * 1.1, r * 0.17, r * 0.06); fill('#e8453c');
        c.beginPath(); c.arc(0, r * 0.98, r * 0.1, 0, TAU); fill('#ffd84d');
      } else if (o === 'bunny') {
        withFace(c, id, r, () => { c.beginPath(); c.ellipse(0, r * 0.07, r * 0.09, r * 0.065, 0, 0, TAU); c.fillStyle = '#ff8fb0'; c.fill(); });
      }
    }

      chain(); c.strokeStyle = OUT; c.lineWidth = r * 0.17; c.stroke();
      chain(); c.strokeStyle = '#ffd84d'; c.lineWidth = r * 0.09; c.setLineDash([r * 0.13, r * 0.05]); c.stroke(); c.setLineDash([]);
      c.strokeStyle = OUT; c.lineWidth = r * 0.07;

    }

    if (w.hat) {
      const h = w.hat, y0 = -r * 0.86;
      if (h === 'party') {
        c.beginPath(); c.moveTo(-r * 0.4, y0); c.lineTo(0, y0 - r * 1.15); c.lineTo(r * 0.4, y0); c.closePath(); fill('#7a5cff');
        c.fillStyle = '#ffd84d';
        for (const [x, y] of [[-0.1, -0.3], [0.12, -0.55], [-0.02, -0.8]]) { c.beginPath(); c.arc(x * r, y0 + y * r, r * 0.06, 0, TAU); c.fill(); }
        c.beginPath(); c.arc(0, y0 - r * 1.15, r * 0.12, 0, TAU); fill('#ffd84d');
      } else if (h === 'chef') {
        for (const [x, y, sz] of [[-0.36, -0.52, 0.34], [0.36, -0.52, 0.34], [0, -0.78, 0.38]]) { c.beginPath(); c.arc(x * r, y0 + y * r, sz * r, 0, TAU); fill('#fff'); }

  function drawDoh(c, id, r, st) {
    const w = st.wear || {};
    c.save(); wearBack(c, r, w, st); c.restore();
    drawBody(c, id, r, st);
    c.save(); wearFront(c, id, r, w, st); c.restore();
  }

  function drawBody(c, id, r, st) {
    const t = st.t || 0;
    c.lineWidth = r * 0.09; c.strokeStyle = OUT; c.lineJoin = 'round';
    switch (id) {
      case 'cube': {
        const g = c.createLinearGradient(-r, -r, r, r);
        g.addColorStop(0, '#eefaff'); g.addColorStop(0.5, '#a8e2ff'); g.addColorStop(1, '#5fb9ea');
        rrPath(c, -r, -r, 2 * r, 2 * r, r * 0.42); c.fillStyle = g; c.fill(); c.stroke();
        c.fillStyle = 'rgba(255,255,255,0.6)'; rrPath(c, -r * 0.72, -r * 0.8, r * 0.7, r * 0.26, r * 0.13); c.fill();
        c.fillStyle = 'rgba(255,255,255,0.55)';
        for (const [x, y, s] of [[0.6, 0.55, 0.1], [0.72, 0.25, 0.06], [-0.62, 0.62, 0.07], [-0.4, 0.78, 0.04]]) { c.beginPath(); c.arc(x * r, y * r, s * r, 0, TAU); c.fill(); }
        face(c, r, st, r * 0.05, 1);
        break;
      }
      case 'gumdrop': {
        const g = c.createRadialGradient(-r * 0.3, -r * 0.4, r * 0.1, 0, 0, r * 1.2);
        g.addColorStop(0, '#ffc2e6'); g.addColorStop(0.6, '#ff6fbf'); g.addColorStop(1, '#d93a95');
        gumdropPath(c, r); c.fillStyle = g; c.fill();
        c.save(); gumdropPath(c, r); c.clip();
        c.fillStyle = 'rgba(255,255,255,0.85)';
        for (const [x, y, s] of SPECKS) { c.fillRect(x * r * 1.1, y * r * 1.1, s * r * 0.6, s * r * 0.6); }
        c.restore();
        gumdropPath(c, r); c.stroke();
        face(c, r, st, r * 0.12, 0.95);
        break;
      }
      case 'snowball': {
        const g = c.createRadialGradient(-r * 0.35, -r * 0.4, r * 0.1, 0, 0, r * 1.1);
        g.addColorStop(0, '#ffffff'); g.addColorStop(0.7, '#eef2ff'); g.addColorStop(1, '#c9d3ee');
        c.beginPath(); c.arc(0, 0, r, 0, TAU); c.fillStyle = g; c.fill();
        c.fillStyle = '#b3c1e3';
        for (const [x, y, s] of SPECKS) { c.beginPath(); c.arc(x * r, y * r, s * r, 0, TAU); c.fill(); }
        c.beginPath(); c.arc(0, 0, r, 0, TAU); c.stroke();
        face(c, r, st, 0, 1);
        break;
      }
      case 'dohnut': {
        c.beginPath(); c.arc(0, 0, r, 0, TAU); c.moveTo(r * 0.3, 0); c.arc(0, 0, r * 0.3, 0, TAU, true);
        const g = c.createRadialGradient(0, 0, r * 0.3, 0, 0, r);
        g.addColorStop(0, '#c98a45'); g.addColorStop(0.5, '#f1c07a'); g.addColorStop(1, '#d99a52');
        c.fillStyle = g; c.fill(); c.stroke();
        c.beginPath();
        for (let i = 0; i <= 56; i++) { const a = i / 56 * TAU, rr = r * (0.83 + 0.05 * Math.sin(a * 7)); i ? c.lineTo(Math.cos(a) * rr, Math.sin(a) * rr) : c.moveTo(Math.cos(a) * rr, Math.sin(a) * rr); }
        c.closePath(); c.moveTo(r * 0.4, 0); c.arc(0, 0, r * 0.4, 0, TAU, true);
        c.fillStyle = '#ff9fcf'; c.fill();
        c.lineCap = 'round'; c.lineWidth = r * 0.07;
        for (const [x, y, rot, col] of SPRINKLES) {
          c.strokeStyle = col; c.beginPath();
          c.moveTo(x * r - Math.cos(rot) * r * 0.07, y * r - Math.sin(rot) * r * 0.07);
          c.lineTo(x * r + Math.cos(rot) * r * 0.07, y * r + Math.sin(rot) * r * 0.07); c.stroke();
        }
        c.strokeStyle = OUT; c.lineWidth = r * 0.07;
        c.beginPath(); c.arc(0, 0, r * 0.3, 0, TAU); c.stroke();
        face(c, r, st, -r * 0.55, 0.62);
        break;
      }
      case 'classic': {
        const g = c.createRadialGradient(-r * 0.35, -r * 0.4, r * 0.1, 0, 0, r * 1.1);
        g.addColorStop(0, '#eaffb0'); g.addColorStop(0.55, '#9be55a'); g.addColorStop(1, '#4fae22');
        c.beginPath();
        for (let i = 0; i <= 48; i++) { const a = i / 48 * TAU, rr = r * (1 + 0.035 * Math.sin(a * 5 + t * 4)); i ? c.lineTo(Math.cos(a) * rr, Math.sin(a) * rr) : c.moveTo(Math.cos(a) * rr, Math.sin(a) * rr); }
        c.closePath(); c.fillStyle = g; c.fill(); c.stroke();
        c.fillStyle = 'rgba(255,255,255,0.6)'; c.beginPath(); c.ellipse(-r * 0.4, -r * 0.55, r * 0.25, r * 0.12, -0.5, 0, TAU); c.fill();
        face(c, r, st, 0, 1);
        break;
      }
      case 'stardust': {
        const g = c.createRadialGradient(-r * 0.35, -r * 0.4, r * 0.1, 0, 0, r * 1.1);
        g.addColorStop(0, '#f0e2ff'); g.addColorStop(0.55, '#b58cff'); g.addColorStop(1, '#6f43d6');
        c.beginPath(); c.arc(0, 0, r, 0, TAU); c.fillStyle = g; c.fill();
        SPECKS.forEach(([x, y, s], i) => {
          const tw = 0.5 + 0.5 * Math.sin(t * 5 + i * 1.7);
          c.fillStyle = `rgba(255,255,255,${0.35 + tw * 0.6})`;
          const sz = s * r * (0.7 + tw * 0.6);
          c.beginPath(); c.moveTo(x * r, y * r - sz); c.lineTo(x * r + sz * 0.35, y * r); c.lineTo(x * r, y * r + sz); c.lineTo(x * r - sz * 0.35, y * r); c.closePath(); c.fill();
        });
        c.beginPath(); c.arc(0, 0, r, 0, TAU); c.stroke();
        face(c, r, st, 0, 1);
        break;
      }
      case 'retriever': {
        // floppy ears sit behind the head
        for (const s of [-1, 1]) {
          c.save(); c.translate(s * r * 0.98, -r * 0.05); c.rotate(s * 0.18 + Math.sin(t * 3) * 0.04 * s);
          c.beginPath(); c.ellipse(0, r * 0.12, r * 0.3, r * 0.58, 0, 0, TAU);
          c.fillStyle = '#b97a2e'; c.fill(); c.stroke(); c.restore();
        }
        const g = c.createLinearGradient(-r, -r, r, r);
        g.addColorStop(0, '#ffe7a8'); g.addColorStop(0.5, '#f4c167'); g.addColorStop(1, '#d9953d');
        rrPath(c, -r, -r, 2 * r, 2 * r, r * 0.42); c.fillStyle = g; c.fill(); c.stroke();
        c.fillStyle = 'rgba(255,255,255,0.45)'; rrPath(c, -r * 0.72, -r * 0.8, r * 0.7, r * 0.26, r * 0.13); c.fill();
        c.strokeStyle = 'rgba(185,122,46,0.55)'; c.lineWidth = r * 0.05; c.lineCap = 'round';
        for (const [x, y] of [[-0.6, 0.55], [0.55, 0.62], [0.7, -0.5], [-0.7, -0.35]]) {
          c.beginPath(); c.moveTo(x * r, y * r); c.lineTo(x * r + r * 0.1, y * r + r * 0.14);
          c.moveTo(x * r + r * 0.14, y * r - r * 0.02); c.lineTo(x * r + r * 0.24, y * r + r * 0.12); c.stroke();
        }
        c.strokeStyle = OUT; c.lineWidth = r * 0.09;
        c.fillStyle = '#fff3d6'; c.beginPath(); c.ellipse(0, r * 0.32, r * 0.44, r * 0.32, 0, 0, TAU); c.fill();
        if (!st.dead) {
          c.beginPath(); c.ellipse(r * 0.02, r * 0.46, r * 0.1, r * 0.13, 0, 0, TAU);
          c.fillStyle = '#ff7a9a'; c.fill(); c.lineWidth = r * 0.05; c.stroke(); c.lineWidth = r * 0.09;
        }
        face(c, r, st, r * 0.05, 1);
        c.fillStyle = OUT; c.beginPath(); c.ellipse(0, r * 0.1, r * 0.12, r * 0.08, 0, 0, TAU); c.fill();
        break;
      }
    }
  }

  // ---------- canvas / sizing ----------
  const cvs = document.getElementById('game');
  const ctx = cvs.getContext('2d');
  const H = 640, GROUND = 84, GY = H - GROUND, PW = 66, SPACING = 225;
  let W = 360, scale = 1;
  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 3);
    const cw = window.innerWidth, ch = window.innerHeight;
    cvs.width = Math.round(cw * dpr); cvs.height = Math.round(ch * dpr);
    cvs.style.width = cw + 'px'; cvs.style.height = ch + 'px';
    scale = cvs.height / H; W = cvs.width / scale;
  }
  window.addEventListener('resize', resize);
  resize();

  // ---------- audio ----------
  let actx = null, muted = store.get('muted', false);
  function unlockAudio() {
    if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
    if (actx && actx.state === 'suspended') actx.resume();
  }
  function tone(f1, f2, dur, type, vol, delay = 0) {
    if (!actx || muted) return;
    const o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime + delay;
    o.type = type; o.frequency.setValueAtTime(f1, t); o.frequency.exponentialRampToValueAtTime(f2, t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t + dur + 0.03);
  }
  function noise(dur, vol) {
    if (!actx || muted) return;
    const n = Math.floor(actx.sampleRate * dur), buf = actx.createBuffer(1, n, actx.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
    const src = actx.createBufferSource(), g = actx.createGain();
    src.buffer = buf; g.gain.value = vol; src.connect(g); g.connect(actx.destination); src.start();
  }
  const sfx = {
    flap() { tone(180 + Math.random() * 40, 480, 0.13, 'sine', 0.22); },
    point() { tone(880, 1200, 0.08, 'triangle', 0.12); tone(1320, 1760, 0.12, 'triangle', 0.1, 0.07); },
    hit() { tone(260, 60, 0.3, 'square', 0.08); tone(140, 40, 0.35, 'sine', 0.3); },
    splat() { tone(120, 45, 0.25, 'sine', 0.3); },
    boom() { noise(0.5, 0.4); tone(160, 30, 0.55, 'sawtooth', 0.2); tone(90, 25, 0.6, 'sine', 0.35); },
    star() { tone(520, 1040, 0.12, 'square', 0.06); tone(780, 1560, 0.12, 'square', 0.06, 0.09); tone(1040, 2080, 0.22, 'square', 0.06, 0.18); },
    starEnd() { tone(900, 300, 0.28, 'triangle', 0.1); },
  };

  // ---------- game state ----------
  let state = 'menu';
  let dohIdx = Math.max(0, DOHS.findIndex(d => d.id === store.get('doh', 'cube')));
  let best = store.get('best', 0);
  let score = 0, pipes = [], parts = [], pops = [], scroll = 0, time = 0, flash = 0, shake = 0;
  let tokens = store.get('tokens', 0), runTokens = 0;
  let owned = store.get('owned', []);
  let equip = Object.assign({ hat: null, face: null, outfit: null, bling: null }, store.get('equip', {}));
  let rings = [], wasStar = false, starT = 0, closetMode = 'mine', confirmItem = null;
  let paused = false, countdown = 0, closetOpen = false, closetSlot = 'hat', closetFrom = 'menu';
  const bird = { x: 0, y: H * 0.45, vy: 0, r: 22, rot: 0, s: 0, sv: 0, blinkT: 2, blink: 0, flapT: 0 };
  const clouds = Array.from({ length: 7 }, (_, i) => ({ x: i * 140 + Math.random() * 80, y: 40 + Math.random() * 220, s: 0.6 + Math.random() * 0.8 }));

  const G = 1500, FLAP = -440, R_HIT = 18;
  const starNow = () => (state === 'play' || state === 'dying' || state === 'over') && ((score >= 20 && score < 25) || (score >= 40 && score < 50));
  const gapFor = () => Math.max(140, 182 - score * 1.4);
  const speedFor = () => Math.min(235, 165 + score * 2);

  const $ = id => document.getElementById(id);
  const scoreEl = $('score'), hintEl = $('hint'), menuEl = $('menu'), overEl = $('over');

  function reset() {
    score = 0; pipes = []; parts = []; pops = []; rings = []; wasStar = false; runTokens = 0; flash = 0; shake = 0;
    bird.x = Math.min(W * 0.3, 150); bird.y = H * 0.45; bird.vy = 0; bird.rot = 0; bird.s = 0; bird.sv = 0;
    scoreEl.textContent = '0';
  }

  function toReady() {
    reset(); state = 'ready';
    menuEl.classList.add('hidden'); overEl.classList.add('hidden');
    hintEl.classList.remove('hidden'); scoreEl.classList.remove('hidden');
  }

  function toMenu() {
    state = 'menu'; reset();
    overEl.classList.add('hidden'); hintEl.classList.add('hidden'); scoreEl.classList.add('hidden');
    menuEl.classList.remove('hidden'); $('menuBest').textContent = 'Best: ' + best;
    buildCards();
  }

  function flap() {
    bird.vy = FLAP; bird.sv += 9; bird.flapT = 0.15;
    sfx.flap();
    const col = DOHS[dohIdx].puff;
    for (let i = 0; i < 5; i++) parts.push({ x: bird.x - 10, y: bird.y + 12, vx: -60 - Math.random() * 80, vy: 20 + Math.random() * 80, life: 0.45, max: 0.45, r: 4 + Math.random() * 5, col });
  }

  function tap() {
    if (paused || closetOpen) return;
    unlockAudio();
    if (state === 'ready') { state = 'play'; hintEl.classList.add('hidden'); spawnInitial(); flap(); }
    else if (state === 'play') flap();
  }

  function spawnInitial() {
    pipes.push(makePipe(Math.max(W + 20, bird.x + 320), H * 0.45));
  }
  function makePipe(x, prevY) {
    const gap = gapFor();
    const minY = 70 + gap / 2, maxY = GY - 60 - gap / 2;
    let y = minY + Math.random() * (maxY - minY);
    y = Math.max(prevY - 190, Math.min(prevY + 190, y));
    return { x, y, gap, scored: false, hue: [290, 190, 330, 140, 40, 260][Math.floor(Math.random() * 6)] };
  }

  function burst(x, y, col, n, spd) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * TAU, v = spd * (0.4 + Math.random());
      parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 0.7, max: 0.7, r: 3 + Math.random() * 5, col });
    }
  }

  function die() {
    state = 'dying'; sfx.hit(); flash = 1; shake = 0.35;
    bird.vy = Math.min(bird.vy, -150); bird.sv -= 10;
    burst(bird.x, bird.y, DOHS[dohIdx].puff, 16, 260);
  }

  function explode() {
    const x = bird.x, y = GY - 6, star = starNow();
    const base = [DOHS[dohIdx].puff, '#ffffff', '#ffd84d', '#ff8fc4'];
    for (let i = 0; i < 48; i++) {
      const a = -Math.PI * (0.04 + 0.92 * Math.random()), v = 140 + Math.random() * 380;
      const col = star ? `hsl(${Math.random() * 360},100%,60%)` : base[i % base.length];
      parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 1 + Math.random() * 0.5, max: 1.5, r: 3 + Math.random() * 7, col });
    }
    rings.push({ x, y, life: 0.5, max: 0.5 });
    sfx.boom(); flash = 0.8; shake = 0.55;
  }

  function landed() {
    bird.y = GY - bird.r; bird.vy = 0; bird.sv -= 16;
    state = 'over'; explode();
    const isBest = score > best;
    if (isBest) { best = score; store.set('best', best); }
    setTimeout(() => {
      if (state !== 'over') return;
      $('finalScore').textContent = score; $('finalBest').textContent = best;
      $('newBest').classList.toggle('hidden', !isBest || score === 0);
      $('earned').innerHTML = '+' + runTokens + ' <span class="ci"></span>';
      $('earned').classList.toggle('hidden', runTokens === 0);
      scoreEl.classList.add('hidden');
      overEl.classList.remove('hidden');
    }, 950);
  }

  function hitRect(cx, cy, r, x, y, w, h) {
    const nx = Math.max(x, Math.min(cx, x + w)), ny = Math.max(y, Math.min(cy, y + h));
    return (cx - nx) ** 2 + (cy - ny) ** 2 < r * r;
  }

  // ---------- update ----------
  function update(dt) {
    time += dt;
    const star = starNow();
    if (star !== wasStar) { wasStar = star; if (star) sfx.star(); else sfx.starEnd(); }
    if (star && state !== 'over') {
      starT -= dt;
      if (starT <= 0) {
        starT = 0.04;
        parts.push({ x: bird.x + (Math.random() - 0.5) * 34, y: bird.y + (Math.random() - 0.5) * 34, vx: -70 + (Math.random() - 0.5) * 90, vy: (Math.random() - 0.5) * 120, life: 0.5, max: 0.5, r: 2 + Math.random() * 4, col: `hsl(${Math.random() * 360},100%,60%)` });
      }
    }
    const moving = state === 'menu' || state === 'ready' || state === 'play';
    const spd = speedFor();
    if (moving) scroll += spd * dt;

    // squish spring
    const acc = -170 * bird.s - 11 * bird.sv;
    bird.sv += acc * dt; bird.s += bird.sv * dt;
    bird.s = Math.max(-0.9, Math.min(1.1, bird.s));
    bird.flapT -= dt;

    // blink
    bird.blinkT -= dt;
    if (bird.blinkT < 0) { bird.blink = 0.12; bird.blinkT = 2 + Math.random() * 3; }
    bird.blink -= dt;

    if (state === 'menu' || state === 'ready') {
      bird.x = Math.min(W * 0.3, 150);
      bird.y = H * 0.45 + Math.sin(time * 3) * 9;
      bird.rot = Math.sin(time * 2) * 0.06;
    }

    if (state === 'play' || state === 'dying') {
      bird.vy += G * dt; bird.y += bird.vy * dt;
      if (bird.y < bird.r) { bird.y = bird.r; bird.vy = Math.max(0, bird.vy); }
      const target = state === 'dying' ? 1.4 : Math.max(-0.35, Math.min(0.7, bird.vy / 900));
      bird.rot += (target - bird.rot) * Math.min(1, dt * (state === 'dying' ? 4 : 10));
      if (bird.y + bird.r >= GY) {
        if (state === 'play') { sfx.hit(); flash = 1; shake = 0.35; }
        landed();
      }
    }

    if (state === 'play') {
      for (const p of pipes) p.x -= spd * dt;
      while (pipes.length && pipes[0].x < -PW - 20) pipes.shift();
      const last = pipes[pipes.length - 1];
      if (last && last.x + SPACING < W + 40) pipes.push(makePipe(last.x + SPACING, last.y));

      for (const p of pipes) {
        const top = p.y - p.gap / 2, bot = p.y + p.gap / 2;
        if (hitRect(bird.x, bird.y, R_HIT, p.x, -500, PW, top + 500) || hitRect(bird.x, bird.y, R_HIT, p.x, bot, PW, GY - bot)) { die(); break; }
        if (!p.scored && p.x + PW < bird.x) {
          p.scored = true; score++; scoreEl.textContent = score; sfx.point();
          const gain = score % 10 === 0 ? 5 : 1;
          setTokens(tokens + gain); runTokens += gain;
          pops.push({ x: W / 2, y: GY + 56, text: '+' + gain, life: 1, gold: gain > 1 });
          burst(bird.x + 20, bird.y - 20, '#ffd84d', 6, 120);
          scoreEl.animate([{ transform: 'scale(1.3)' }, { transform: 'scale(1)' }], { duration: 180 });
        }
      }
    }

    for (const p of parts) { p.life -= dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 300 * dt; p.vx *= 0.98; if (p.y > GY - 2 && p.vy > 0) { p.y = GY - 2; p.vy *= -0.35; p.vx *= 0.7; } }
    for (const g of rings) g.life -= dt;
    rings = rings.filter(g => g.life > 0);
    parts = parts.filter(p => p.life > 0);
    for (const p of pops) { p.life -= dt; p.y -= 22 * dt; }
    pops = pops.filter(p => p.life > 0);
    for (const c of clouds) { if (moving) c.x -= spd * 0.15 * c.s * dt; if (c.x < -120) { c.x = W + 60 + Math.random() * 100; c.y = 40 + Math.random() * 220; } }
    flash = Math.max(0, flash - dt * 4);
    shake = Math.max(0, shake - dt);
  }

  // ---------- render ----------
  function drawCloud(x, y, s) {
    ctx.fillStyle = 'rgba(255,255,255,0.9)';
    ctx.beginPath();
    ctx.arc(x, y, 22 * s, 0, TAU); ctx.arc(x + 24 * s, y - 12 * s, 26 * s, 0, TAU);
    ctx.arc(x + 52 * s, y, 22 * s, 0, TAU); ctx.rect(x, y, 52 * s, 22 * s);
    ctx.fill();
  }

  function drawHills(offset, base, amp, col, freq) {
    ctx.fillStyle = col; ctx.beginPath(); ctx.moveTo(0, GY);
    for (let x = 0; x <= W + 10; x += 10) ctx.lineTo(x, base - amp * (0.5 + 0.5 * Math.sin((x + offset) * freq)) - amp * 0.3 * Math.sin((x + offset) * freq * 2.3));
    ctx.lineTo(W + 10, GY); ctx.closePath(); ctx.fill();
  }

  function tube(x, y0, y1, capBottom, hue) {
    const g = ctx.createLinearGradient(x, 0, x + PW, 0);
    g.addColorStop(0, `hsl(${hue},70%,58%)`); g.addColorStop(0.3, `hsl(${hue},85%,80%)`); g.addColorStop(1, `hsl(${hue},65%,45%)`);
    ctx.fillStyle = g; ctx.strokeStyle = OUT; ctx.lineWidth = 3;
    ctx.fillRect(x, y0, PW, y1 - y0); ctx.strokeRect(x, y0, PW, y1 - y0);
    // squishy blobs inside the tube
    ctx.fillStyle = `hsla(${hue},90%,92%,0.5)`;
    for (let yy = capBottom ? y1 - 50 : y0 + 50; capBottom ? yy > y0 : yy < y1; yy += capBottom ? -44 : 44) {
      ctx.beginPath(); ctx.ellipse(x + PW * 0.32, yy, 7, 12, 0, 0, TAU); ctx.fill();
    }
    const ch = 28, cx = x - 7, cw = PW + 14, cy = capBottom ? y1 - ch : y0;
    const g2 = ctx.createLinearGradient(cx, 0, cx + cw, 0);
    g2.addColorStop(0, `hsl(${hue},70%,60%)`); g2.addColorStop(0.3, `hsl(${hue},90%,85%)`); g2.addColorStop(1, `hsl(${hue},65%,48%)`);
    rrPath(ctx, cx, cy, cw, ch, 10); ctx.fillStyle = g2; ctx.fill(); ctx.stroke();
  }

  // star power: draw the Doh offscreen, then recolor it with a cycling hue (keeps shading + outlines)
  const off = document.createElement('canvas'), octx = off.getContext('2d');
  const sil = document.createElement('canvas'), sctx = sil.getContext('2d');
  const OFF = 170;
  const BLEND_OK = (() => { const c = document.createElement('canvas').getContext('2d'); c.globalCompositeOperation = 'color'; return c.globalCompositeOperation === 'color'; })();
  function drawRainbowDoh(id, r, st, hue) {
    const px = Math.ceil(OFF * scale);
    if (off.width !== px) { off.width = off.height = sil.width = sil.height = px; }
    octx.setTransform(1, 0, 0, 1, 0, 0); octx.globalCompositeOperation = 'source-over'; octx.globalAlpha = 1; octx.clearRect(0, 0, px, px);
    octx.setTransform(scale, 0, 0, scale, px / 2, px / 2);
    drawDoh(octx, id, r, st);
    octx.setTransform(1, 0, 0, 1, 0, 0);
    sctx.setTransform(1, 0, 0, 1, 0, 0); sctx.globalCompositeOperation = 'source-over'; sctx.clearRect(0, 0, px, px);
    sctx.drawImage(off, 0, 0);
    sctx.globalCompositeOperation = 'source-in';
    sctx.fillStyle = `hsl(${hue},100%,${BLEND_OK ? 50 : 60}%)`; sctx.fillRect(0, 0, px, px);
    octx.globalCompositeOperation = BLEND_OK ? 'color' : 'source-atop';
    octx.globalAlpha = BLEND_OK ? 1 : 0.55;
    octx.drawImage(sil, 0, 0);
    octx.globalAlpha = 1; octx.globalCompositeOperation = 'source-over';
    ctx.drawImage(off, -OFF / 2, -OFF / 2, OFF, OFF);
  }

  function render() {
    ctx.setTransform(scale, 0, 0, scale, 0, 0);
    if (shake > 0) ctx.translate((Math.random() - 0.5) * 12 * shake, (Math.random() - 0.5) * 12 * shake);

    const sky = ctx.createLinearGradient(0, 0, 0, GY);
    sky.addColorStop(0, '#7ec8f0'); sky.addColorStop(1, '#d9f1ff');
    ctx.fillStyle = sky; ctx.fillRect(-20, -20, W + 40, GY + 20);

    ctx.fillStyle = 'rgba(255,240,170,0.9)'; ctx.beginPath(); ctx.arc(W - 70, 90, 38, 0, TAU); ctx.fill();
    for (const c of clouds) drawCloud(c.x, c.y, c.s);
    drawHills(scroll * 0.2, GY - 70, 60, '#b9e3c6', 0.012);
    drawHills(scroll * 0.4 + 300, GY - 20, 45, '#8fd4a4', 0.02);

    for (const p of pipes) {
      tube(p.x, -10, p.y - p.gap / 2, true, p.hue);
      tube(p.x, p.y + p.gap / 2, GY, false, p.hue);
    }

    // ground
    ctx.fillStyle = '#f5d58a'; ctx.fillRect(-20, GY, W + 40, GROUND + 20);
    ctx.fillStyle = '#ecc46e';
    const off = scroll % 28;
    for (let x = -off - 28; x < W + 28; x += 28) {
      ctx.beginPath(); ctx.moveTo(x, GY + 16); ctx.lineTo(x + 14, GY + 16); ctx.lineTo(x + 4, GY + GROUND); ctx.lineTo(x - 10, GY + GROUND); ctx.fill();
    }
    ctx.fillStyle = '#7fd36a'; ctx.fillRect(-20, GY, W + 40, 16);
    ctx.strokeStyle = OUT; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(-20, GY); ctx.lineTo(W + 20, GY); ctx.moveTo(-20, GY + 16); ctx.lineTo(W + 20, GY + 16); ctx.stroke();

    for (const p of parts) {
      ctx.globalAlpha = Math.max(0, p.life / p.max);
      ctx.fillStyle = p.col; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, TAU); ctx.fill();
    }
    ctx.globalAlpha = 1;
    for (const g of rings) {
      const k = 1 - g.life / g.max;
      ctx.globalAlpha = 1 - k; ctx.lineWidth = 8 * (1 - k) + 2; ctx.strokeStyle = '#fff8d0';
      ctx.beginPath(); ctx.arc(g.x, g.y, 14 + k * 110, 0, TAU); ctx.stroke();
    }
    ctx.globalAlpha = 1;

    // bird
    if (state !== 'over') {
      const s = bird.s, star = starNow(), hue = (time * 420) % 360;
      const st = { t: time, blink: bird.blink > 0, dead: state === 'dying', flap: bird.flapT > 0, wear: equip };
      if (star) {
        const gl = ctx.createRadialGradient(bird.x, bird.y, 6, bird.x, bird.y, 52);
        gl.addColorStop(0, `hsla(${hue},100%,70%,0.6)`); gl.addColorStop(1, `hsla(${hue},100%,70%,0)`);
        ctx.fillStyle = gl; ctx.fillRect(bird.x - 56, bird.y - 56, 112, 112);
      }
      ctx.save();
      ctx.translate(bird.x, bird.y); ctx.rotate(bird.rot);
      ctx.scale(1 - s * 0.26, 1 + s * 0.32);
      if (star) drawRainbowDoh(DOHS[dohIdx].id, bird.r, st, hue);
      else drawDoh(ctx, DOHS[dohIdx].id, bird.r, st);
      ctx.restore();
    }

    ctx.font = '900 26px ui-rounded, system-ui, sans-serif'; ctx.textAlign = 'left'; ctx.lineJoin = 'round';
    for (const p of pops) {
      ctx.globalAlpha = Math.min(1, p.life * 2.5);
      const tw = ctx.measureText(p.text).width, x0 = p.x - (tw + 30) / 2;
      ctx.lineWidth = 5; ctx.strokeStyle = OUT; ctx.strokeText(p.text, x0, p.y);
      ctx.fillStyle = p.gold ? '#ffd84d' : '#fff'; ctx.fillText(p.text, x0, p.y);
      const cx = x0 + tw + 17, cy = p.y - 9;
      const g = ctx.createRadialGradient(cx - 4, cy - 4, 1, cx, cy, 12);
      g.addColorStop(0, '#fff7b8'); g.addColorStop(0.45, '#ffd84d'); g.addColorStop(1, '#e9a800');
      ctx.beginPath(); ctx.arc(cx, cy, 11, 0, TAU); ctx.fillStyle = g; ctx.fill();
      ctx.lineWidth = 3; ctx.strokeStyle = OUT; ctx.stroke();
      ctx.beginPath(); ctx.arc(cx, cy, 5, 0, TAU); ctx.lineWidth = 2; ctx.strokeStyle = 'rgba(170,105,0,0.65)'; ctx.stroke();
    }
    ctx.globalAlpha = 1;
    ctx.textAlign = 'start';

    if (flash > 0) { ctx.fillStyle = `rgba(255,255,255,${flash * 0.7})`; ctx.fillRect(-20, -20, W + 40, H + 40); }
  }

  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.033, (now - last) / 1000); last = now;
    if (paused) {
      if (countdown > 0) {
        countdown -= dt;
        if (countdown <= 0) { paused = false; countEl.classList.add('hidden'); }
        else countEl.textContent = Math.ceil(countdown / 0.8);
      }
    } else update(dt);
    render();
    if (closetOpen) drawPreview();
    if (confirmItem) drawConfirm();
    syncUI();
    requestAnimationFrame(frame);
  }

  // ---------- menu ----------
  function buildCards() {
    const wrap = $('dohs'); wrap.innerHTML = '';
    const dpr = Math.min(window.devicePixelRatio || 1, 3);
    DOHS.forEach((d, i) => {
      const b = document.createElement('button');
      b.className = 'card' + (i === dohIdx ? ' sel' : '');
      const c = document.createElement('canvas'); c.width = 64 * dpr; c.height = 64 * dpr;
      const x = c.getContext('2d'); x.scale(dpr, dpr);
      const small = !!equip.hat || ['dino', 'doggy', 'bunny'].includes(equip.outfit);
      x.translate(32, small ? 38 : 33);
      drawDoh(x, d.id, small ? 17 : 22, { t: 1, wear: equip });
      b.appendChild(c); b.appendChild(document.createTextNode(d.name));
      b.addEventListener('click', () => {
        unlockAudio(); dohIdx = i; store.set('doh', d.id);
        wrap.querySelectorAll('.card').forEach((el, j) => el.classList.toggle('sel', j === i));
        sfx.flap();
      });
      wrap.appendChild(b);
    });
  }

  // ---------- tokens, closet, shop ----------
  const hudEl = $('hud'), pauseBtn = $('pauseBtn'), pauseEl = $('pause'), countEl = $('count'), closetEl = $('closet'), confirmEl = $('confirm');
  const coin = n => '<span class="ci"></span>' + n;
  function setTokens(n) {
    tokens = n; store.set('tokens', n);
    hudEl.innerHTML = coin(n); $('menuTokens').innerHTML = coin(n); $('closetTokens').innerHTML = coin(n);
  }
  let toastT = 0;
  function toast(html) {
    const el = $('toast'); el.innerHTML = html; el.classList.remove('hidden');
    clearTimeout(toastT); toastT = setTimeout(() => el.classList.add('hidden'), 1600);
  }

  function buildCloset() {
    document.querySelectorAll('.tab[data-slot]').forEach(b => b.classList.toggle('sel', b.dataset.slot === closetSlot));
    document.querySelectorAll('.tab[data-mode]').forEach(b => b.classList.toggle('sel', b.dataset.mode === closetMode));
    const shop = closetMode === 'shop';
    $('closetTitle').textContent = shop ? 'Shop' : 'My Closet';
    const wrap = $('items'); wrap.innerHTML = ''; wrap.scrollTop = 0;
    const dpr = Math.min(window.devicePixelRatio || 1, 3);
    const id = DOHS[dohIdx].id;
    const slotItems = ITEMS.filter(i => i.slot === closetSlot);
    const list = shop ? slotItems : [{ id: null, name: 'None' }].concat(slotItems.filter(i => owned.includes(i.id)));
    list.forEach(it => {
      const isOwned = it.id === null || owned.includes(it.id);
      const worn = !shop && equip[closetSlot] === it.id;
      const cant = shop && !isOwned && tokens < it.price;
      const b = document.createElement('button');
      b.className = 'card' + (worn ? ' sel' : '') + (cant ? ' cant' : '') + (shop && isOwned ? ' owned' : '');
      const c = document.createElement('canvas'); c.width = 64 * dpr; c.height = 64 * dpr;
      const x = c.getContext('2d'); x.scale(dpr, dpr); x.translate(32, 38);
      drawDoh(x, id, 16, { t: 1, wear: { [closetSlot]: it.id } });
      b.appendChild(c); b.appendChild(document.createTextNode(it.name));
      const p = document.createElement('span'); p.className = 'price';
      p.innerHTML = shop ? (isOwned ? 'Owned ✓' : coin(it.price)) : worn ? 'Wearing' : it.id === null ? 'Take off' : 'Wear';
      b.appendChild(p);
      b.addEventListener('click', () => onItem(it, b));
      wrap.appendChild(b);
    });
    if (!shop && list.length === 1) {
      const e = document.createElement('div'); e.className = 'empty';
      e.textContent = 'Nothing here yet. Visit the Shop to get something!';
      wrap.appendChild(e);
    }
  }

  function onItem(it, el) {
    unlockAudio();
    const slot = closetSlot;
    if (closetMode === 'mine') {
      equip[slot] = (it.id !== null && equip[slot] === it.id) ? null : it.id;   // tap a worn item to take it off
      sfx.flap(); store.set('equip', equip); buildCloset(); return;
    }
    if (owned.includes(it.id)) { toast('Already in your closet!'); return; }
    if (tokens < it.price) {
      el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake');
      toast('Need ' + (it.price - tokens) + ' more ' + coin(''));
      tone(220, 110, 0.18, 'square', 0.06);
      return;
    }
    askBuy(it);
  }

  function askBuy(it) {
    confirmItem = it;
    $('confirmText').innerHTML = 'Spend ' + coin(it.price) + ' on <b>' + it.name + '</b>?<br><small>You\'ll have ' + coin(tokens - it.price) + ' left</small>';
    confirmEl.classList.remove('hidden');
  }
  function closeConfirm() { confirmItem = null; confirmEl.classList.add('hidden'); }
  $('confirmNo').addEventListener('click', closeConfirm);
  $('confirmYes').addEventListener('click', () => {
    const it = confirmItem; closeConfirm();
    if (!it || owned.includes(it.id) || tokens < it.price) return;
    unlockAudio();
    setTokens(tokens - it.price); owned.push(it.id); store.set('owned', owned);
    equip[it.slot] = it.id; store.set('equip', equip);
    sfx.point(); toast('Bought ' + it.name + '! Wearing it now.');
    buildCloset();
  });

  function openCloset(from, mode) {
    closetFrom = from; closetMode = mode; closetOpen = true;
    menuEl.classList.add('hidden'); overEl.classList.add('hidden');
    closetEl.classList.remove('hidden'); buildCloset();
  }
  function closeCloset() {
    closeConfirm(); closetOpen = false; closetEl.classList.add('hidden');
    if (closetFrom === 'over') overEl.classList.remove('hidden'); else menuEl.classList.remove('hidden');
    buildCards();
  }

  const pv = $('preview'), pctx = pv.getContext('2d'), cv = $('confirmCv'), cctx = cv.getContext('2d');
  function drawPreview() {
    const dpr = Math.min(window.devicePixelRatio || 1, 3);
    if (pv.width !== Math.round(112 * dpr)) { pv.width = pv.height = Math.round(112 * dpr); }
    pctx.setTransform(dpr, 0, 0, dpr, 0, 0); pctx.clearRect(0, 0, 112, 112);
    const sq = Math.sin(time * 3) * 0.04;
    pctx.save(); pctx.translate(56, 68 + Math.sin(time * 2) * 2); pctx.scale(1 - sq, 1 + sq);
    drawDoh(pctx, DOHS[dohIdx].id, 30, { t: time, blink: bird.blink > 0, wear: equip });
    pctx.restore();
  }
  function drawConfirm() {
    const dpr = Math.min(window.devicePixelRatio || 1, 3);
    if (cv.width !== Math.round(96 * dpr)) { cv.width = cv.height = Math.round(96 * dpr); }
    cctx.setTransform(dpr, 0, 0, dpr, 0, 0); cctx.clearRect(0, 0, 96, 96);
    const sq = Math.sin(time * 3) * 0.04;
    cctx.save(); cctx.translate(48, 58 + Math.sin(time * 2) * 2); cctx.scale(1 - sq, 1 + sq);
    drawDoh(cctx, DOHS[dohIdx].id, 26, { t: time, blink: bird.blink > 0, wear: Object.assign({}, equip, { [confirmItem.slot]: confirmItem.id }) });
    cctx.restore();
  }

  document.querySelectorAll('.tab[data-slot]').forEach(b => b.addEventListener('click', () => { closetSlot = b.dataset.slot; buildCloset(); }));
  document.querySelectorAll('.tab[data-mode]').forEach(b => b.addEventListener('click', () => { closetMode = b.dataset.mode; buildCloset(); }));
  $('openCloset').addEventListener('click', () => openCloset('menu', 'mine'));
  $('openShop').addEventListener('click', () => openCloset('menu', 'shop'));
  $('overCloset').addEventListener('click', () => openCloset('over', 'mine'));
  $('overShop').addEventListener('click', () => openCloset('over', 'shop'));
  $('closetDone').addEventListener('click', closeCloset);

  // ---------- pause (auto-pauses when you leave the app) ----------
  function pauseGame() {
    if (paused) {
      if (countdown > 0) { countdown = 0; countEl.classList.add('hidden'); pauseEl.classList.remove('hidden'); }
      return;
    }
    if (state !== 'play' && state !== 'dying') return;
    paused = true; countdown = 0;
    pauseEl.classList.remove('hidden');
    if (actx && actx.state === 'running') { try { actx.suspend(); } catch (e) {} }
  }
  function resumeGame() {
    if (!paused || countdown > 0) return;
    unlockAudio();
    pauseEl.classList.add('hidden');
    countdown = 2.4; countEl.textContent = '3'; countEl.classList.remove('hidden');
  }
  function syncUI() {
    pauseBtn.classList.toggle('hidden', !(state === 'play' && !paused));
    hudEl.classList.toggle('hidden', paused || !(state === 'ready' || state === 'play' || state === 'dying'));
  }
  document.addEventListener('visibilitychange', () => { if (document.hidden) pauseGame(); });
  window.addEventListener('pagehide', pauseGame);
  window.addEventListener('blur', pauseGame);
  pauseBtn.addEventListener('click', pauseGame);
  $('resume').addEventListener('click', resumeGame);
  $('quit').addEventListener('click', () => { paused = false; countdown = 0; pauseEl.classList.add('hidden'); countEl.classList.add('hidden'); toMenu(); });
  window.addEventListener('keydown', e => {
    if (e.code === 'KeyP' || e.code === 'Escape') { e.preventDefault(); paused ? resumeGame() : pauseGame(); }
  });

  function syncMute() { $('mute').textContent = muted ? '🔇' : '🔊'; }
  $('mute').addEventListener('click', () => { muted = !muted; store.set('muted', muted); syncMute(); unlockAudio(); });
  $('play').addEventListener('click', () => { unlockAudio(); toReady(); });
  $('again').addEventListener('click', () => { unlockAudio(); toReady(); });
  $('change').addEventListener('click', toMenu);

  cvs.addEventListener('pointerdown', e => { e.preventDefault(); tap(); });
  window.addEventListener('keydown', e => { if (e.code === 'Space' || e.code === 'ArrowUp') { e.preventDefault(); tap(); } });
  document.addEventListener('touchmove', e => { if (e.target.closest && e.target.closest('.scroll')) return; e.preventDefault(); }, { passive: false });
  document.addEventListener('gesturestart', e => e.preventDefault());

  syncMute();
  setTokens(tokens);
  toMenu();
  requestAnimationFrame(frame);

  // offline support (only works over HTTPS, e.g. GitHub Pages)
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
</body>
</html>
