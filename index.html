<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Flappy Doh">
<meta name="theme-color" content="#8fd3ff">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<title>Flappy Doh</title>
<style>
  :root {
    --ink: #2a1f33;
    --pink: #ff5fa2;
    --pink-dark: #d63a80;
    --panel: #fffaf2;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: #8fd3ff;
    position: fixed; inset: 0;
    overscroll-behavior: none;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
    font-family: ui-rounded, "SF Pro Rounded", "Arial Rounded MT Bold", system-ui, sans-serif;
    color: var(--ink);
  }
  canvas#game { display: block; touch-action: none; }

  #score {
    position: fixed; left: 0; right: 0;
    top: calc(env(safe-area-inset-top) + 28px);
    text-align: center; font-size: 64px; font-weight: 900; color: #fff;
    -webkit-text-stroke: 3px var(--ink); paint-order: stroke fill;
    text-shadow: 0 4px 0 rgba(42,31,51,0.35);
    pointer-events: none;
  }
  #hint {
    position: fixed; left: 0; right: 0; top: 30%;
    text-align: center; font-size: 30px; font-weight: 900; color: #fff;
    -webkit-text-stroke: 2px var(--ink); paint-order: stroke fill;
    pointer-events: none;
    animation: pulse 1s ease-in-out infinite alternate;
  }
  #hint small { display: block; font-size: 16px; -webkit-text-stroke: 1px var(--ink); margin-top: 8px; }
  @keyframes pulse { from { transform: scale(1); } to { transform: scale(1.08); } }

  .overlay {
    position: fixed; inset: 0; z-index: 10;
    display: flex; align-items: center; justify-content: center;
    padding: calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 16px);
    background: rgba(42,31,51,0.25);
    -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px);
  }
  .hidden { display: none !important; }
  .panel {
    width: min(100%, 390px);
    background: var(--panel);
    border: 4px solid var(--ink);
    border-radius: 28px;
    box-shadow: 0 8px 0 var(--ink);
    padding: 20px 18px 18px;
    text-align: center;
    animation: pop .35s cubic-bezier(.3,1.6,.5,1);
  }
  @keyframes pop { from { transform: scale(.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  h1 { margin: 0; font-size: 44px; line-height: 1; font-weight: 900; letter-spacing: -1px; }
  h1 span { color: var(--pink); }
  h2 { margin: 0 0 12px; font-size: 44px; font-weight: 900; color: var(--pink); -webkit-text-stroke: 2px var(--ink); paint-order: stroke fill; }
  .sub { margin: 6px 0 14px; font-weight: 700; opacity: .7; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 16px; }
  .card {
    appearance: none; font: inherit; color: inherit;
    border: 3px solid transparent; border-radius: 18px;
    background: #efe9ff; padding: 6px 4px 8px;
    font-size: 12px; font-weight: 800; line-height: 1.1;
    touch-action: manipulation; cursor: pointer;
  }
  .card canvas { width: 64px; height: 64px; display: block; margin: 0 auto 4px; }
  .card.sel { border-color: var(--pink); background: #ffe3f0; }
  .card.sel canvas { animation: bob .8s ease-in-out infinite alternate; }
  @keyframes bob { from { transform: translateY(2px) scale(1.04, .96); } to { transform: translateY(-4px) scale(.97, 1.04); } }
  .btn {
    appearance: none; font: inherit; width: 100%;
    font-size: 24px; font-weight: 900; color: #fff;
    background: var(--pink); border: 3px solid var(--ink);
    border-radius: 18px; padding: 12px;
    box-shadow: 0 5px 0 var(--ink);
    touch-action: manipulation; cursor: pointer;
  }
  .btn:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--ink); }
  .btn.secondary { background: #7ec8f0; margin-top: 12px; font-size: 20px; }
  .row { display: flex; justify-content: space-between; align-items: center; margin-top: 14px; font-weight: 800; }
  .icon-btn {
    appearance: none; font-size: 22px; background: #efe9ff;
    border: 3px solid var(--ink); border-radius: 14px; width: 48px; height: 44px;
    touch-action: manipulation; cursor: pointer;
  }
  .scores { display: flex; gap: 12px; margin-bottom: 12px; }
  .scores div { flex: 1; background: #efe9ff; border: 3px solid var(--ink); border-radius: 16px; padding: 8px; }
  .scores small { display: block; font-weight: 800; opacity: .7; }
  .scores b { font-size: 40px; }
  .badge {
    display: inline-block; margin-bottom: 14px; padding: 4px 14px;
    background: #ffd84d; border: 3px solid var(--ink); border-radius: 999px; font-weight: 900;
    animation: pulse .6s ease-in-out infinite alternate;
  }
  .hud {
    position: fixed; top: calc(env(safe-area-inset-top) + 14px); left: 14px; z-index: 5;
    background: #fff3b8; border: 3px solid var(--ink); border-radius: 999px;
    padding: 3px 12px; font-weight: 900; font-size: 18px; box-shadow: 0 3px 0 var(--ink);
    pointer-events: none;
  }
  #pauseBtn { position: fixed; top: calc(env(safe-area-inset-top) + 10px); right: 14px; z-index: 5; }
  #count {
    position: fixed; inset: 0; z-index: 20; display: flex; align-items: center; justify-content: center;
    font-size: 150px; font-weight: 900; color: #fff; -webkit-text-stroke: 6px var(--ink); paint-order: stroke fill;
    pointer-events: none;
  }
  .duo { display: flex; gap: 10px; margin-top: 12px; }
  .duo .btn { margin-top: 0; font-size: 16px; padding: 10px 4px; }
  .coin {
    display: inline-block; font-weight: 900; font-size: 18px; background: #fff3b8;
    border: 3px solid var(--ink); border-radius: 999px; padding: 1px 12px;
  }
  .earned {
    display: inline-block; margin: 0 4px 12px; padding: 4px 14px; background: #fff3b8;
    border: 3px solid var(--ink); border-radius: 999px; font-weight: 900;
  }
  #closet .panel { display: flex; flex-direction: column; max-height: 100%; }
  .chead { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .chead h3 {
    margin: 0; font-size: 32px; font-weight: 900; color: var(--pink);
    -webkit-text-stroke: 2px var(--ink); paint-order: stroke fill;
  }
  #preview {
    width: 112px; height: 112px; margin: 0 auto 8px; display: block; flex: none;
    background: #e6f6ff; border: 3px solid var(--ink); border-radius: 24px;
  }
  .tabs { display: flex; gap: 6px; margin-bottom: 8px; flex: none; }
  .tab {
    flex: 1; appearance: none; font: inherit; font-weight: 900; font-size: 14px; padding: 7px 0;
    border: 3px solid var(--ink); border-radius: 14px; background: #efe9ff; color: inherit;
    cursor: pointer; touch-action: manipulation;
  }
  .tab.sel { background: var(--pink); color: #fff; }
  .scroll { overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; touch-action: pan-y; flex: 1 1 auto; min-height: 0; }
  #menu .panel { display: flex; flex-direction: column; max-height: 100%; }
  #dohs { padding: 3px; align-content: start; }
  #items { padding: 3px; margin-bottom: 12px; align-content: start; }
  .card .price { display: block; margin-top: 3px; font-size: 11px; opacity: .85; }
  .card.cant .price { color: #c0264f; }
  .card.shake { animation: shake .3s; }
  @keyframes shake { 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
  .toast {
    position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 24px); transform: translateX(-50%);
    background: var(--ink); color: #fff; padding: 8px 16px; border-radius: 999px; font-weight: 800;
    z-index: 30; pointer-events: none; white-space: nowrap;
  }
  .ci {
    display: inline-block; width: .95em; height: .95em; border-radius: 50%; position: relative;
    vertical-align: -0.12em; margin-right: .22em;
    background: radial-gradient(circle at 35% 30%, #fff7b8 0, #ffd84d 42%, #e9a800 100%);
    border: .13em solid var(--ink);
  }
  .ci::after {
    content: ''; position: absolute; left: 28%; top: 28%; width: 44%; height: 44%;
    border-radius: 50%; border: .09em solid rgba(170,105,0,.65);
  }
  .empty { grid-column: 1 / -1; padding: 14px 8px 6px; font-weight: 800; opacity: .65; }
  .card.owned { opacity: .55; }
  .card.legend { position: relative; background: linear-gradient(#fff6d6, #ffe7f6) padding-box, linear-gradient(120deg, #ff5fa2, #ffd84d, #6fd3ff, #b06cff, #ff5fa2) border-box; border-color: transparent; background-size: 100% 100%, 300% 300%; animation: legendShift 3s linear infinite; }
  .card.legend::before { content: 'LEGENDARY'; position: absolute; top: -7px; left: 50%; transform: translateX(-50%); font-size: 8px; letter-spacing: .5px; font-weight: 900; color: #fff; background: #2a1f33; padding: 1px 5px; border-radius: 6px; }
  .card.legend.sel { border-color: transparent; }
  @keyframes legendShift { to { background-position: 0 0, 300% 0; } }
  .card.earn { background: #2b1840; color: #ffd9a8; border-color: #ff8a3d; }
  .card.earn .price { color: #ffb36b; opacity: 1; font-size: 10px; }
  .course { margin: 2px 0 10px; }
  .bank { display: inline-flex; gap: 10px; align-items: center; }
  .candyc { color: #ff8a3d; }
  .tab[data-mode="candy"].sel { background: #ff8a3d; }
  .tab[data-mode="cookie"].sel { background: #c8864a; }
  .tabs .tab[data-mode], .course .tab { font-size: 13px; padding-left: 4px; padding-right: 4px; }
  .cookiec { color: #a0602a; }
  .course .tab[data-course="christmas"].sel { background: #2f9e57; }
  .card.kshop { background: #f3fbf4; }
  .card.kshop .price { color: #b3122e; font-weight: 900; }
  .card.kshop.cant .price { color: #c0264f; }
  .card.locked { background: #f3fbf4; }
  .card.locked canvas { filter: saturate(.55) brightness(.92); }
  .card.locked .price { color: #b3122e; font-weight: 900; }
  .card.locked.cant .price { color: #c0264f; }
  .tabs .tab[data-slot] { font-size: 12px; }
  .card.cshop { background: #fff1e0; }
  .card.cshop .price { color: #d4621a; font-weight: 900; }
  .card.cshop.cant .price { color: #c0264f; }
  .course .tab[data-course="halloween"].sel { background: #ff8a3d; }
  #confirmCv {
    width: 96px; height: 96px; display: block; margin: 6px auto 10px;
    background: #e6f6ff; border: 3px solid var(--ink); border-radius: 22px;
  }
  #confirm .panel h2 { font-size: 34px; margin-bottom: 4px; }
  #confirm .sub { font-size: 18px; opacity: 1; line-height: 1.5; }
  #confirm .sub small { font-size: 14px; opacity: .7; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="score" class="hidden">0</div>
<div id="hint" class="hidden">Tap to squish!<small>Tap anywhere to flap</small></div>

<div id="menu" class="overlay">
  <div class="panel">
    <h1>Flappy<span>Doh</span></h1>
    <p class="sub">Pick your Doh</p>
    <div id="dohs" class="grid scroll"></div>
    <div class="tabs course"><button class="tab" data-course="classic">☀️ Classic</button><button class="tab" data-course="halloween">🎃 Halloween</button><button class="tab" data-course="christmas">🎄 Christmas</button></div>
    <button id="play" class="btn">Play</button>
    <div class="duo"><button id="openCloset" class="btn secondary">👒 My Closet</button><button id="openShop" class="btn secondary">🛍️ Shop</button></div>
    <div class="row"><span id="menuBest">Best: 0</span><span class="bank"><span id="menuCandy" class="coin candyc">🍬0</span><span id="menuCookies" class="coin cookiec">🍪0</span><span id="menuTokens" class="coin"><span class="ci"></span>0</span></span><button id="mute" class="icon-btn" aria-label="Sound">🔊</button></div>
  </div>
</div>

<div id="over" class="overlay hidden">
  <div class="panel">
    <h2>SPLAT!</h2>
    <div class="scores">
      <div><small>Score</small><b id="finalScore">0</b></div>
      <div><small>Best</small><b id="finalBest">0</b></div>
    </div>
    <div><span id="earned" class="earned hidden">+0 <span class="ci"></span></span></div>
    <div id="newBest" class="badge hidden">New best!</div>
    <button id="again" class="btn">Play again</button>
    <div class="duo">
      <button id="change" class="btn secondary">Change Doh</button>
      <button id="overCloset" class="btn secondary">👒 Closet</button>
      <button id="overShop" class="btn secondary">🛍️ Shop</button>
    </div>
  </div>
</div>

<div id="hud" class="hud hidden"><span class="ci"></span>0</div>
<button id="pauseBtn" class="icon-btn hidden" aria-label="Pause">⏸</button>
<div id="count" class="hidden">3</div>

<div id="pause" class="overlay hidden">
  <div class="panel">
    <h2>Paused</h2>
    <p class="sub">Your Doh is taking a breather.</p>
    <button id="resume" class="btn">Resume</button>
    <button id="quit" class="btn secondary">Quit to menu</button>
  </div>
</div>

<div id="closet" class="overlay hidden">
  <div class="panel">
    <div class="chead"><h3 id="closetTitle">My Closet</h3><span class="bank"><span id="closetCandy" class="coin candyc">🍬0</span><span id="closetCookies" class="coin cookiec">🍪0</span><span id="closetTokens" class="coin"><span class="ci"></span>0</span></span></div>
    <canvas id="preview"></canvas>
    <div class="tabs">
      <button class="tab sel" data-mode="mine">👒 My Closet</button>
      <button class="tab" data-mode="shop">🛍️ Shop</button>
      <button class="tab" data-mode="candy">🍬 Candy</button>
      <button class="tab" data-mode="cookie">🍪 Cookies</button>
    </div>
    <div class="tabs">
      <button class="tab sel" data-slot="hat">Hats</button>
      <button class="tab" data-slot="face">Faces</button>
      <button class="tab" data-slot="outfit">Outfits</button>
      <button class="tab" data-slot="bling">Bling</button>
      <button class="tab" data-slot="ride">Rides</button>
    </div>
    <div id="items" class="grid scroll"></div>
    <button id="closetDone" class="btn">Done</button>
  </div>
</div>
<div id="confirm" class="overlay hidden">
  <div class="panel">
    <h2>Buy it?</h2>
    <canvas id="confirmCv"></canvas>
    <p id="confirmText" class="sub"></p>
    <div class="duo"><button id="confirmNo" class="btn secondary">Not yet</button><button id="confirmYes" class="btn">Buy it!</button></div>
  </div>
</div>
<div id="toast" class="toast hidden"></div>

<script>
(() => {
  // ---------- storage (safe) ----------
  const store = {
    get(k, d) { try { const v = localStorage.getItem('flappydoh.' + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem('flappydoh.' + k, JSON.stringify(v)); } catch (e) {} },
  };

  // ---------- characters ----------
  const DOHS = [
    { id: 'cube',     name: 'Nice Cube',       puff: '#bfeaff' },
    { id: 'gumdrop',  name: 'Gumdrop',         puff: '#ff9bd2' },
    { id: 'snowball', name: 'Snowball Crunch', puff: '#ffffff' },
    { id: 'dohnut',   name: 'Dohnut',          puff: '#ffb3d9' },
    { id: 'classic',  name: 'Groovy Glob',     puff: '#b8f27a' },
    { id: 'stardust', name: 'Stardust',        puff: '#d6b8ff' },
    { id: 'retriever', name: 'Golden Retriever', puff: '#f2c46d' },
    { id: 'turtle',  name: 'Turtle',          puff: '#9be55a' },
    { id: 'pumpkin', name: 'Pumpkin',         puff: '#ff9a3d' },
    { id: 'ghost',   name: 'Ghost',           puff: '#e8eeff' },
    // ---- Christmas Dohs: bought with cookies ----
    { id: 'frosty',      name: 'Frosty',       puff: '#ffffff', cookie: 100 },
    { id: 'gingerbread', name: 'Gingerbread',  puff: '#d9a066', cookie: 150 },
    { id: 'elf',         name: 'Elf Doh',      puff: '#9be55a', cookie: 200 },
    { id: 'reindoh',     name: 'Reindoh',      puff: '#ff6b6b', cookie: 300 },
    { id: 'ornament',    name: 'Ornament',     puff: '#ffd84d', cookie: 500 },
  ];
  const OUT = '#2a1f33';
  const TAU = Math.PI * 2;

  function rng(seed) { let s = seed >>> 0; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }
  const SPECKS = (() => { const R = rng(7), a = []; for (let i = 0; i < 16; i++) { const ang = R() * TAU, d = Math.sqrt(R()) * 0.82; a.push([Math.cos(ang) * d, Math.sin(ang) * d, 0.035 + R() * 0.05]); } return a; })();
  const SPRINKLES = (() => { const R = rng(11), cols = ['#fff', '#ffd84d', '#6fd3ff', '#8ee04a', '#b06cff']; const a = []; for (let i = 0; i < 14; i++) { const ang = R() * TAU, d = 0.5 + R() * 0.28; a.push([Math.cos(ang) * d, Math.sin(ang) * d, R() * Math.PI, cols[i % cols.length]]); } return a; })();

  function rrPath(c, x, y, w, h, r) {
    c.beginPath(); c.moveTo(x + r, y);
    c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r);
    c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
  }

  function face(c, r, st, oy, k) {
    c.save(); c.translate(0, oy); c.scale(k, k);
    const ey = -r * 0.12, ex = r * 0.36, er = r * 0.14;
    c.fillStyle = OUT; c.strokeStyle = OUT; c.lineCap = 'round';
    if (st.dead) {
      c.lineWidth = r * 0.09;
      for (const s of [-1, 1]) {
        const x = s * ex; c.beginPath();
        c.moveTo(x - er, ey - er); c.lineTo(x + er, ey + er);
        c.moveTo(x + er, ey - er); c.lineTo(x - er, ey + er); c.stroke();
      }
      c.beginPath(); c.ellipse(0, r * 0.3, r * 0.13, r * 0.1, 0, 0, TAU); c.fill();
    } else {
      for (const s of [-1, 1]) { c.beginPath(); c.ellipse(s * ex, ey, er, st.blink ? er * 0.15 : er * 1.25, 0, 0, TAU); c.fill(); }
      if (!st.blink) {
        c.fillStyle = '#fff';
        for (const s of [-1, 1]) { c.beginPath(); c.arc(s * ex + er * 0.35, ey - er * 0.45, er * 0.42, 0, TAU); c.fill(); }
      }
      c.lineWidth = r * 0.07; c.beginPath();
      if (st.flap) c.ellipse(0, r * 0.26, r * 0.1, r * 0.12, 0, 0, TAU), c.fill();
      else c.arc(0, r * 0.12, r * 0.14, 0.15 * Math.PI, 0.85 * Math.PI), c.stroke();
    }
    c.fillStyle = 'rgba(255,100,150,0.45)';
    for (const s of [-1, 1]) { c.beginPath(); c.ellipse(s * r * 0.62, r * 0.18, r * 0.14, r * 0.08, 0, 0, TAU); c.fill(); }
    c.restore();
  }

  function gumdropPath(c, r) {
    c.beginPath();
    c.moveTo(-r * 0.95, r * 0.7);
    c.bezierCurveTo(-r * 1.05, -r * 0.3, -r * 0.55, -r * 1.05, 0, -r * 1.05);
    c.bezierCurveTo(r * 0.55, -r * 1.05, r * 1.05, -r * 0.3, r * 0.95, r * 0.7);
    c.quadraticCurveTo(r * 0.95, r * 0.95, r * 0.7, r * 0.95);
    c.lineTo(-r * 0.7, r * 0.95);
    c.quadraticCurveTo(-r * 0.95, r * 0.95, -r * 0.95, r * 0.7);
    c.closePath();
  }

  // ---------- closet items ----------
  const ITEMS = [
    { id: 'party',  slot: 'hat',    name: 'Party Hat',   price: 10 },
    { id: 'chef',   slot: 'hat',    name: 'Chef Hat',    price: 20 },
    { id: 'cowboy', slot: 'hat',    name: 'Cowboy Hat',  price: 30 },
    { id: 'prop',   slot: 'hat',    name: 'Propeller',   price: 40 },
    { id: 'tophat', slot: 'hat',    name: 'Top Hat',     price: 50 },
    { id: 'crown',  slot: 'hat',    name: 'Crown',       price: 100 },
    { id: 'nerd',   slot: 'face',   name: 'Nerd Specs',  price: 15 },
    { id: 'shades', slot: 'face',   name: 'Shades',      price: 25 },
    { id: 'stache', slot: 'face',   name: 'Mustache',    price: 30 },
    { id: 'hearts', slot: 'face',   name: 'Heart Specs', price: 40 },
    { id: 'bowtie', slot: 'outfit', name: 'Bow Tie',     price: 10 },
    { id: 'tie',    slot: 'outfit', name: 'Necktie',     price: 15 },
    { id: 'scarf',  slot: 'outfit', name: 'Scarf',       price: 25 },
    { id: 'cape',   slot: 'outfit', name: 'Hero Cape',   price: 60 },
    { id: 'tiger',  slot: 'outfit', name: 'Tiger Stripes Tee', price: 45 },
    { id: 'doggy',  slot: 'outfit', name: 'Doggy Costume', price: 70 },
    { id: 'dino',   slot: 'outfit', name: 'Dino Costume', price: 75 },
    { id: 'bunny',  slot: 'outfit', name: 'Plush Bunny', price: 80 },
    { id: 'chain',  slot: 'bling',  name: 'Gold Chain',  price: 90 },
    // ---- big-ticket items ----
    { id: 'monocle',  slot: 'face',   name: 'Fancy Monocle',  price: 120 },
    { id: 'viking',   slot: 'hat',    name: 'Viking Helmet',  price: 150 },

    else if (did === 'ornament') for (let i = 0; i < 4; i++) parts.push({ x: bird.x + (Math.random() - 0.5) * 30, y: bird.y + (Math.random() - 0.5) * 30, vx: -50, vy: (Math.random() - 0.5) * 60, life: 0.5, max: 0.5, r: 2 + Math.random() * 3, col: ['#ff4d4d', '#ffd84d', '#6fd3ff', '#9dffb0'][i] });

  function spawnInitial() {
    pipes.push(makePipe(Math.max(W + 20, bird.x + 320), H * 0.45));

  function makePipe(x, prevY) {
    const gap = gapFor();
    const minY = 70 + gap / 2, maxY = GY - 60 - gap / 2;

  function burst(x, y, col, n, spd) {

  function landed() {

  }

  function hitRect(cx, cy, r, x, y, w, h) {
    const nx = Math.max(x, Math.min(cx, x + w)), ny = Math.max(y, Math.min(cy, y + h));
    return (cx - nx) ** 2 + (cy - ny) ** 2 < r * r;
  }

  // ---------- scoring (shared by both courses) ----------
  function scorePoint() {
    score++; scoreEl.textContent = score; sfx.point();
    const gain = score % 10 === 0 ? 5 : 1;
    setTokens(tokens + gain); runTokens += gain;
    pops.push({ x: W / 2, y: GY + 56, text: '+' + gain, life: 1, gold: gain > 1 });

  }

  // ---------- halloween course ----------
  const BOO_LINES = ['Boo!', 'Nope!', 'Whooo?', 'Not today!', 'Eek!', 'Spooky!', 'Nice dodge!', 'So squishy!', 'Come back!'];
  const SNOW_LINES = ['Brrr!', 'Ho ho ho!', 'Nice!', 'Too cold!', 'Merry!', 'Snow way!', 'Ice dodge!', 'Jolly good!', 'Chilly!'];
  function hPassed(p) {
    eventPassed(p);
    if (flipK !== 1 || flipLeft > 0) return;
    const talker = p.kind === 'ghost' || p.kind === 'snowman';
    if (talker && Math.random() < 0.6) {
      const L = HW() ? BOO_LINES : SNOW_LINES;
      bubbles.push({ p, top: Math.random() < 0.5, text: L[Math.floor(Math.random() * L.length)], life: 1.3 });
      if (HW()) sfx.boo(); else sfx.jingle();

  }
  function grabCandy(x, y, gold) {
    const gain = (gold ? 5 : 1) * (jackRun ? 2 : 1);
    if (XM()) { setCookies(cookies + gain); runCookies += gain; } else { setCandy(candy + gain); runCandy += gain; }
    stats().candies++; saveStats();
    pops.push({ x: x + 10, y: y - 22, text: '+' + gain, life: 0.8, gold, candy: true, cookie: XM() });

  }
  let earnQ = [], earnBusy = false;
  function nextEarn() { if (!earnQ.length) { earnBusy = false; return; } earnBusy = true; toast(earnQ.shift()); sfx.unlock(); setTimeout(nextEarn, 1900); }
  function earn(id) {
    if (owned.includes(id)) return;
    const it = ITEMS.find(i => i.id === id); owned.push(id); store.set('owned', owned);
    earnQ.push((it.xmas ? '🎄' : '🎃') + ' Unlocked <b>' + it.name + '</b>! Check your closet.');
    if (!earnBusy) nextEarn();
  }
  function checkEarns() {

  function earnProg(it) {

    if (it.id === 'milkcookies') return ' (' + Math.min(100, xStats.candies) + '/100)';
    return '';

  const holeX = p => p.x + PW + (SPACING - PW) / 2 - HOLEW / 2;
  function holeHit() {
    for (const p of pipes) if (p.hole) { const hx = holeX(p); if (bird.x > hx - 4 && bird.x < hx + HOLEW + 4) return true; }
    return false;
  }

  function phantomUpdate(dt) {
    const ph = phantom; ph.t += dt;
    ph.trail -= dt;
    if (ph.trail <= 0 && ph.phase !== 'gone') {
      ph.trail = 0.035;
      parts.push({ x: ph.x + (Math.random() - 0.5) * 22, y: ph.y + 18, vx: 30 + Math.random() * 50, vy: -60 - Math.random() * 40, life: 0.55, max: 0.55, r: 3 + Math.random() * 4, col: XM() ? (Math.random() < 0.5 ? '#ff4d4d' : '#ffffff') : (Math.random() < 0.5 ? '#9dffb0' : '#d6b8ff') });
    }
    if (ph.phase === 'enter') {
      const k = Math.min(1, ph.t / 1.2), e = 1 - (1 - k) ** 3, tx = bird.x + 150, ty = 140;
      ph.x = ph.sx + (tx - ph.sx) * e; ph.y = ph.sy + (ty - ph.sy) * e;
      if (k >= 1) { ph.phase = 'loop'; ph.t = 0; ph.cx = tx; ph.cy = ty + 55; }
    } else if (ph.phase === 'loop') {
      const a = -Math.PI / 2 + ph.t * TAU / 1.1;
      ph.x = ph.cx + Math.cos(a) * 55; ph.y = ph.cy + Math.sin(a) * 55;
      const target = state === 'play' && ph.t > 2.2 && pipes.find(p => !p.scored && p.x > bird.x + 170 && p.x < W - 20);
      if (target) { ph.phase = 'dive'; ph.t = 0; ph.sx = ph.x; ph.sy = ph.y; ph.pipe = target; target.hole = true; }
      if (state !== 'play' && ph.t > 2.5) phantom = null;
    } else if (ph.phase === 'dive') {
      const p = ph.pipe, k = Math.min(1, ph.t / 1.3);
      const gx = p.x + PW / 2, gy = p.y, hx = holeX(p) + HOLEW / 2, hy = GY + 26;
      if (k < 0.5) { const e = (k / 0.5) ** 0.8; ph.x = ph.sx + (gx - ph.sx) * e; ph.y = ph.sy + (gy - ph.sy) * e; }
      else { const e = ((k - 0.5) / 0.5) ** 1.6; ph.x = gx + (hx - gx) * e; ph.y = gy + (hy - gy) * e; }
      ph.rot = Math.atan2(k < 0.5 ? gy - ph.sy : hy - gy, k < 0.5 ? gx - ph.sx : hx - gx) * 0.5;
      if (k >= 1) { ph.phase = 'gone'; ph.say = ''; burst(hx, GY, XM() ? '#ffffff' : '#9dffb0', 5, 90); }
    } else if (ph.phase === 'gone') {
      if (!pipes.includes(ph.pipe) || holeX(ph.pipe) + HOLEW < bird.x - 30) {

      }
    }
  }

  function enterCrypt() {
    state = 'crypt';
    const CF = H - 110;
    crypt = { t: 0, pts: 0, candies: [], jack: { t: 4.6, y: Math.random() < 0.5 ? 92 : CF - 50, got: false, miss: false } };
    for (let i = 0; i < 10; i++) crypt.candies.push({ t: 0.8 + i * 0.48, y: Math.max(90, Math.min(CF - 40, H * 0.46 + Math.sin(i * 1.25 + Math.random()) * 140)), got: false, miss: false, gold: i === 4 || i === 9 });
    phantom = null; nextPhantom = phantomAt(phantomIdx);
    fade = 1; fadeCol = '12,4,20';
    bird.vy = 0; bird.rot = 0; bird.sv -= 8;
    sfx.whoosh();
    stats().crypts++; saveStats();
  }
  function cryptUpdate(dt) {
    const c = crypt; c.t += dt;
    const ceil = 52, floor = H - 110, spd = speedFor();
    bird.vy += G * dt; bird.y += bird.vy * dt;
    if (bird.y - bird.r < ceil) { bird.y = ceil + bird.r; bird.vy = Math.max(0, bird.vy); }
    if (bird.y + bird.r > floor) { bird.y = floor - bird.r; bird.vy = -300; bird.sv -= 8; sfx.splat(); }   // bonk, no dying down here
    bird.rot += (Math.max(-0.35, Math.min(0.7, bird.vy / 900)) - bird.rot) * Math.min(1, dt * 10);
    const due = Math.min(5, Math.floor(c.t / 1.1));
    while (c.pts < due) { c.pts++; scorePoint(); }
    for (const cd of c.candies) {
      if (cd.got || cd.miss) continue;
      const x = bird.x + 14 + (cd.t - c.t) * spd;
      if (Math.abs(x - bird.x) < 28 && Math.abs(cd.y - bird.y) < 32) { cd.got = true; grabCandy(x, cd.y, cd.gold); }
      else if (x < bird.x - 34) cd.miss = true;
    }
    const j = c.jack;
    if (!j.got && !j.miss) {
      const x = bird.x + (j.t - c.t) * spd;
      if (Math.abs(x - bird.x) < 38 && Math.abs(j.y - bird.y) < 40) {
        j.got = true; jackRun = true;
        banner = XM() ? { text: "RUDOLPH'S NOSE!", sub: '2x cookies + one free crash', life: 2.4 } : { text: "JACK'S FLAME!", sub: '2x candy + one free crash', life: 2.4 };
        burst(x, j.y, XM() ? '#ff3b3b' : '#ff8a3d', 24, 280); burst(x, j.y, '#ffd84d', 12, 200); flash = 0.5;
        sfx.unlock(); earn(XM() ? 'rednose' : 'flamejack');
      } else if (x < bird.x - 40) j.miss = true;

  }
  function exitCrypt() {
    state = 'play'; crypt = null;

  }

  function tryShield() {

    banner = { text: XM() ? 'JINGLE SAVE!' : 'PUMPKIN SMASH!', sub: 'Saved you!', life: 1.6 };

  function meltPile() {
    meltObj = { x: bird.x, t: 0 };
    burst(bird.x, GY - 10, '#ffffff', 14, 180); burst(bird.x, GY - 6, '#bfe6ff', 8, 140);

  }

  function bonePile() {
    const x = bird.x; boneBits = [];
    for (let i = 0; i < 7; i++) boneBits.push({ x: x + (Math.random() - 0.5) * 10, y: GY - 14, vx: (Math.random() - 0.5) * 260, vy: -180 - Math.random() * 260, rot: Math.random() * TAU, vr: (Math.random() - 0.5) * 14, len: 14 + Math.random() * 10 });
    boneBits.push({ x, y: GY - 20, vx: (Math.random() - 0.5) * 60, vy: -330, rot: 0, vr: (Math.random() - 0.5) * 8, skull: true });

  }

  function hUpdate(dt, spd, moving) {
    if (meltObj) meltObj.t += dt;
    for (const b of boneBits) {
      const floor = GY - (b.skull ? 11 : 4);
      b.vy += 1500 * dt; b.x += b.vx * dt; b.y += b.vy * dt; b.rot += b.vr * dt;
      if (b.y > floor) {
        b.y = floor; b.vy = Math.abs(b.vy) > 60 ? -b.vy * 0.35 : 0; b.vx *= 0.6; b.vr *= 0.5;
        if (b.vy === 0) { b.vx *= 0.8; if (b.skull) b.rot *= 0.85; }
        if (Math.abs(b.vy) > 40) tone(1300 + Math.random() * 500, 700, 0.03, 'square', 0.03);
      }
    }
    if (XM()) for (const f of flakes) {
      f.y += (30 + f.s * 30) * dt; f.x -= ((moving ? spd * 0.15 : 8) * f.s + Math.sin(time + f.ph) * 12) * dt;
      if (f.y > H + 10) { f.y = -10; f.x = Math.random() * (W + 100); }
      if (f.x < -10) f.x += W + 40;
    }
    if (HW()) for (const b of bats) {
      b.x -= ((moving ? spd * 0.25 : 15) + 25) * b.s * dt; b.ph += dt * 14;
      if (b.x < -40) { b.x = W + 40 + Math.random() * 120; b.y = 50 + Math.random() * 220; }
    }
    witchT -= dt;
    if (witchT <= 0 && state !== 'crypt') { witchT = 7 + Math.random() * 7; witches.push({ x: W + 60, y: 70 + Math.random() * 150, t: 0, v: 150 + Math.random() * 80 }); if (XM()) { sfx.sleighbells(); setTimeout(() => sfx.hoho(), 500); } else sfx.cackle(); }
    for (const w of witches) { w.t += dt; w.x -= w.v * dt; }
    witches = witches.filter(w => w.x > -120);
    lightT -= dt;
    if (lightT <= 0 && state !== 'crypt' && HW()) { lightT = 8 + Math.random() * 9; lightning = 1; setTimeout(() => sfx.thunder(), 250); }
    lightning = Math.max(0, lightning - dt * 2.2);
    invuln = Math.max(0, invuln - dt);
    if (banner) { banner.life -= dt; if (banner.life <= 0) banner = null; }
    fade = Math.max(0, fade - dt * 2.5);
    for (const b of bubbles) b.life -= dt;
    bubbles = bubbles.filter(b => b.life > 0);
    for (const g of graves) g.x -= (state === 'play' ? spd : 0) * dt;
    graves = graves.filter(g => g.x > -80);
    if (state === 'play') {
      for (const p of pipes) {
        const c = p.candy; if (!c || c.got) continue;
        const cx = p.x + PW / 2, cy = p.y + c.dy;
        if ((bird.x - cx) ** 2 + (bird.y - cy) ** 2 < 30 * 30) { c.got = true; grabCandy(cx, cy, c.gold); }
      }
      if (!phantom && score >= nextPhantom && !eventBusy()) { phantom = { phase: 'enter', t: 0, x: W + 50, y: 90, sx: W + 50, sy: 90, trail: 0, say: '', rot: 0 }; phantomIdx++; sfx.phantom(); }
    }
    if (phantom && state !== 'crypt') phantomUpdate(dt);
    if (state === 'crypt') cryptUpdate(dt);
    eventsUpdate(dt, spd);
  }

  // ---------- events: rewind portal + upside-down replay, sleigh ride, snowball fight ----------
  let flipK = 1, flipTarget = 1, flipLeft = 0, flipSpawn = 0, portalIdx = 0, portalNext = 16, rewindT = 0;
  let sleighIdx = 0, sleighNext = 12, swoop = null, ride = null;
  let fightIdx = 0, fightNext = 32, fightSpawn = 0, fightLeft = 0, snowballs = [];
  const portalAt = i => (HW() ? 14 : 16) + i * 30 + Math.floor(Math.random() * 3);

  function render() {
    ctx.setTransform(scale, 0, 0, scale, 0, 0);
    if (shake > 0) ctx.translate((Math.random() - 0.5) * 12 * shake, (Math.random() - 0.5) * 12 * shake);
    ctx.save();
    if (flipK !== 1) { ctx.translate(0, H / 2); ctx.scale(1, flipK); ctx.translate(0, -H / 2); }   // upside-down replay flips the whole world

    if (HW()) { if (state === 'crypt') drawCrypt(); else drawSpooky(); }
    else if (XM()) { if (state === 'crypt') drawWorkshop(); else drawWinter(); } else {
    const sky = ctx.createLinearGradient(0, 0, 0, GY);
    sky.addColorStop(0, '#7ec8f0'); sky.addColorStop(1, '#d9f1ff');
    ctx.fillStyle = sky; ctx.fillRect(-20, -20, W + 40, GY + 20);

    ctx.fillStyle = 'rgba(255,240,170,0.9)'; ctx.beginPath(); ctx.arc(W - 70, 90, 38, 0, TAU); ctx.fill();
    for (const c of clouds) drawCloud(c.x, c.y, c.s);
    drawHills(scroll * 0.2, GY - 70, 60, '#b9e3c6', 0.012);
    drawHills(scroll * 0.4 + 300, GY - 20, 45, '#8fd4a4', 0.02);

    for (const p of pipes) {
      tube(p.x, -10, p.y - p.gap / 2, true, p.hue);
      tube(p.x, p.y + p.gap / 2, GY, false, p.hue);
    }

    // ground
    ctx.fillStyle = '#f5d58a'; ctx.fillRect(-20, GY, W + 40, GROUND + 20);
    ctx.fillStyle = '#ecc46e';
    const off = scroll % 28;
    for (let x = -off - 28; x < W + 28; x += 28) {
      ctx.beginPath(); ctx.moveTo(x, GY + 16); ctx.lineTo(x + 14, GY + 16); ctx.lineTo(x + 4, GY + GROUND); ctx.lineTo(x - 10, GY + GROUND); ctx.fill();
    }
    ctx.fillStyle = '#7fd36a'; ctx.fillRect(-20, GY, W + 40, 16);
    ctx.strokeStyle = OUT; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(-20, GY); ctx.lineTo(W + 20, GY); ctx.moveTo(-20, GY + 16); ctx.lineTo(W + 20, GY + 16); ctx.stroke();
    }

    for (const p of parts) {
      ctx.globalAlpha = Math.max(0, p.life / p.max);
      ctx.fillStyle = p.col; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, TAU); ctx.fill();
    }
    ctx.globalAlpha = 1;
    for (const g of rings) {
      const k = 1 - g.life / g.max;
      ctx.globalAlpha = 1 - k; ctx.lineWidth = 8 * (1 - k) + 2; ctx.strokeStyle = '#fff8d0';
      ctx.beginPath(); ctx.arc(g.x, g.y, 14 + k * 110, 0, TAU); ctx.stroke();
    }
    ctx.globalAlpha = 1;

    // bird
    if (state !== 'over') {
      const s = bird.s, star = starNow(), hue = (time * 420) % 360;
      const st = { t: time, blink: bird.blink > 0, dead: state === 'dying', flap: bird.flapT > 0, wear: Object.assign({}, equip, jackRun && HW() ? { hat: 'flamejack' } : jackRun && XM() ? { face: 'rednose' } : {}, state === 'sleighride' ? { ride: 'sleigh' } : {}) };
      if (jackRun && SP()) {
        const jg = ctx.createRadialGradient(bird.x, bird.y - 20, 6, bird.x, bird.y - 20, 80);
        const jc = XM() ? '255,60,60' : '255,160,50';
        jg.addColorStop(0, 'rgba(' + jc + ',0.35)'); jg.addColorStop(1, 'rgba(' + jc + ',0)');
        ctx.fillStyle = jg; ctx.fillRect(bird.x - 80, bird.y - 100, 160, 160);
      }
      if (invuln > 0) ctx.globalAlpha = 0.45 + 0.55 * (Math.sin(time * 40) > 0 ? 1 : 0);
      if (star) {
        const gl = ctx.createRadialGradient(bird.x, bird.y, 6, bird.x, bird.y, 52);
        gl.addColorStop(0, `hsla(${hue},100%,70%,0.6)`); gl.addColorStop(1, `hsla(${hue},100%,70%,0)`);
        ctx.fillStyle = gl; ctx.fillRect(bird.x - 56, bird.y - 56, 112, 112);
      }
      ctx.save();
      ctx.translate(bird.x, bird.y); ctx.rotate(bird.rot);
      ctx.scale(1 - s * 0.26, 1 + s * 0.32);
      if (HW() && state === 'dying') drawSkelDoh(bird.r);
      else if (XM() && state === 'dying') drawSnowDoh(bird.r);
      else if (star) drawRainbowDoh(DOHS[dohIdx].id, bird.r, st, hue);
      else drawDoh(ctx, DOHS[dohIdx].id, bird.r, st);
      ctx.restore(); ctx.globalAlpha = 1;
    }

    if (SP()) drawSpookyTop();
    ctx.restore();
    if (SP()) drawOverlay();

    ctx.font = '900 26px ui-rounded, system-ui, sans-serif'; ctx.textAlign = 'left'; ctx.lineJoin = 'round';
    for (const p of pops) {
      ctx.globalAlpha = Math.min(1, p.life * 2.5);
      const py = H / 2 + (p.y - H / 2) * flipK;
      const tw = ctx.measureText(p.text).width, x0 = p.x - (tw + 30) / 2;
      ctx.lineWidth = 5; ctx.strokeStyle = OUT; ctx.strokeText(p.text, x0, py);
      ctx.fillStyle = p.gold ? '#ffd84d' : '#fff'; ctx.fillText(p.text, x0, py);
      const cx = x0 + tw + 17, cy = py - 9;
      if (p.candy) { ctx.save(); ctx.translate(cx, cy); ctx.scale(0.7, 0.7); if (p.cookie) drawCookie(0, 0, p.gold); else drawCandy(0, 0, p.gold); ctx.restore(); continue; }
      const g = ctx.createRadialGradient(cx - 4, cy - 4, 1, cx, cy, 12);
      g.addColorStop(0, '#fff7b8'); g.addColorStop(0.45, '#ffd84d'); g.addColorStop(1, '#e9a800');

      ctx.lineWidth = 3; ctx.strokeStyle = OUT; ctx.stroke();

    }

    ctx.textAlign = 'start';

  }

  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.033, (now - last) / 1000); last = now;
    if (paused) {

        else countEl.textContent = Math.ceil(countdown / 0.8);

  }

  function buildCloset() {
    document.querySelectorAll('.tab[data-slot]').forEach(b => b.classList.toggle('sel', b.dataset.slot === closetSlot));
    document.querySelectorAll('.tab[data-mode]').forEach(b => b.classList.toggle('sel', b.dataset.mode === closetMode));
    const shop = closetMode !== 'mine', cshop = closetMode === 'candy', kshop = closetMode === 'cookie';

  // ---------- pause (auto-pauses when you leave the app) ----------

      return;
    }
    if (state !== 'play' && state !== 'dying' && state !== 'crypt' && state !== 'sleighride') return;
    paused = true; countdown = 0;
    pauseEl.classList.remove('hidden');
    if (actx && actx.state === 'running') { try { actx.suspend(); } catch (e) {} }
  }

  }

  }
  document.addEventListener('visibilitychange', () => { if (document.hidden) pauseGame(); });
  window.addEventListener('pagehide', pauseGame);
  window.addEventListener('blur', pauseGame);
  pauseBtn.addEventListener('click', pauseGame);
  $('resume').addEventListener('click', resumeGame);
  $('quit').addEventListener('click', () => { paused = false; countdown = 0; pauseEl.classList.add('hidden'); countEl.classList.add('hidden'); toMenu(); });
  window.addEventListener('keydown', e => {
    if (e.code === 'KeyP' || e.code === 'Escape') { e.preventDefault(); paused ? resumeGame() : pauseGame(); }
  });

  function syncMute() { $('mute').textContent = muted ? '🔇' : '🔊'; }
  $('mute').addEventListener('click', () => { muted = !muted; store.set('muted', muted); syncMute(); unlockAudio(); });
  $('play').addEventListener('click', () => { unlockAudio(); toReady(); });
  $('again').addEventListener('click', () => { unlockAudio(); toReady(); });
  $('change').addEventListener('click', toMenu);

  cvs.addEventListener('pointerdown', e => { e.preventDefault(); tap(); });
  window.addEventListener('keydown', e => { if (e.code === 'Space' || e.code === 'ArrowUp') { e.preventDefault(); tap(); } });
  document.addEventListener('touchmove', e => { if (e.target.closest && e.target.closest('.scroll')) return; e.preventDefault(); }, { passive: false });
  document.addEventListener('gesturestart', e => e.preventDefault());

  function setCourse(name) {
    course = name; store.set('course', course);
    best = store.get(bestKey(), 0); $('menuBest').textContent = 'Best: ' + best;
    document.querySelectorAll('.tab[data-course]').forEach(b => b.classList.toggle('sel', b.dataset.course === course));
    witches = []; phantom = null; paintBank();
  }
  document.querySelectorAll('.tab[data-course]').forEach(b => b.addEventListener('click', () => {
    unlockAudio(); if (b.dataset.course !== course) { setCourse(b.dataset.course); if (HW()) sfx.cackle(); else if (XM()) sfx.jingle(); else sfx.point(); }
  }));
  setCourse(course);

  syncMute();
  setTokens(tokens);
  toMenu();
  requestAnimationFrame(frame);

  // offline support (only works over HTTPS, e.g. GitHub Pages)
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
</body>
</html>
